summary_ja: 製薬の営業リソースの適正な量と配分を検討するため、顧客をセグメント化してベイズ推定で製品シェアの事後分布を求め、モンテカルロ・シミュレーションで経営リソースの効果を推定した。
problem: 事業目標の達成には人・物・金・情報などの資源の活用が必要で、製薬では医薬品の適正使用情報の提供が重要な経営資源。資源の量と配分の意思決定を支援したい。
approach: 顧客をセグメント化し、ベイズ推定で製品シェアの事後分布を計算してから、モンテカルロ法でリソース量・配分の影響をシミュレーションする。
