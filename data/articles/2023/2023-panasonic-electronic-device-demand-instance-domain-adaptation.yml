summary_ja: 対象製品のみのデータでは学習データが少なく実用的な精度が出ない電子デバイスの需要予測で、時系列特徴量によるクラスタリングを使ってソースドメインから学習データを選んで対象を拡張するインスタンスベースのドメイン適応を提案した。
problem: 製造業では対象製品のデータが少なく、需要予測の精度が実用水準に達しにくい。
approach: 需要特性を表す時系列特徴量でクラスタリングし、ソースドメインから類似データを抽出して対象ドメインの学習データを拡張する。
