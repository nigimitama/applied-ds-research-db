summary_ja: ニュース記事の閲覧時間をマルチモーダル機械学習で予測する手法を議論した。閲覧時間はページビューより読了の程度が分かり、コンテンツ推薦や分析に有用。
problem: ページビューよりも詳細にユーザーの嗜好を把握できる閲覧時間を予測したい。最も単純な実装は記事の長さとの相関に基づく。
approach: 記事のテキストなど複数の情報を入力するマルチモーダルな機械学習モデルで閲覧時間を予測する。
