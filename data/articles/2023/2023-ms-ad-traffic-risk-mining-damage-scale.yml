summary_ja: 交通事故履歴データから、被害規模を考慮して任意の地点での事故発生を予測し、事故が起きる要因も同時に特定する手法を提案した。事故の重大度に応じてドライバーへの注意喚起レベルを変えられる。
problem: 事故の起きたことがない地点でも、ドライバーが危険な地域に近づく際に注意喚起したい。
approach: 事故履歴データから事故の発生と被害規模を同時にモデル化し、事故の要因を同定する。
