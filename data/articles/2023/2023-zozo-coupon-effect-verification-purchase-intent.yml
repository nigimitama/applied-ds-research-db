summary_ja: オンラインクーポンの効果を、ユーザーの潜在的な購買意欲を考慮して推定する機械学習ベースの検証モデルを提案した。購買意欲が低いユーザーは粗利が増えやすく、高いユーザーでは粗利が減りやすいという差を扱う。
problem: クーポンを無差別に配ると利益率が下がるリスクがあり、効果の推定が必要。購買意欲によってクーポンの効果が異なる。
approach: ユーザーの潜在的な購買意欲を考慮した機械学習モデルで、クーポン配布施策の効果を検証する。
