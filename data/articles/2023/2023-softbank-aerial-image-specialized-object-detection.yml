summary_ja: 航空機搭載の通信プラットフォームに載せたカメラの空撮画像で、カメラと対象物の位置関係によって写り方が変わる問題に対し、写り方のパターンで分類した画像ごとに特化型の物体検出モデルを作る方法を検討した。
problem: 空撮画像では、カメラと対象物の位置関係により対象物の見え方が変わり、物体検出が難しい。
