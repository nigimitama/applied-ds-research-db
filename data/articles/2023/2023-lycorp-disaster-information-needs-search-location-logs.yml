summary_ja: 過去の災害を事例に、被災地域のユーザーの位置情報と検索履歴から地域ごとの避難のシグナルを調べた。2022年台風14号では、主要交通機関の運行情報や地域の食料品店の休業情報がシグナルとして見つかり、地域差もあった。
problem: 災害時は時々刻々と情報ニーズが変わり、ユーザーの状況に合った情報の提供が必要。
approach: 被災地域のユーザーの位置情報と検索履歴を分析して、地域ごとの避難のシグナルを特定する。
