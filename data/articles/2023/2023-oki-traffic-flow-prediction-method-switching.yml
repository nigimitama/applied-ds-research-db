summary_ja: プローブデータによる交通流予測で、事故などの突発事象の影響がない流れには蓄積データの交通密度推移に基づく統計的予測を、影響がある流れには別の予測を使い、交通流の特性に応じて切り替えるアルゴリズムを提案した。
problem: 渋滞緩和や事故削減のため正確な道路交通情報を提供したいが、突発事象の有無で適切な予測法が異なる。
approach: 突発事象の影響がない場合は過去の交通密度推移に基づく統計的予測、影響がある場合は別の予測法を用い、交通流の特性で自動的に切り替える。
