summary_ja: TikTokの多様なシナリオにまたがるユーザー行動を統合する汎用グラフ学習フレームワークTTGLを提案した。得られた埋め込みは共通の埋め込み基盤から検索・ランキングで再利用される。
problem: シナリオごとに異なる多様なユーザー行動を、巨大なグラフ上で一貫して学習し再利用できる形にすることが難しい。
approach: 二経路のソースノード選択と、種類に適応した重み付きランダムウォークを備えたグラフ学習を行い、埋め込みをUniversal Embedding基盤で提供する。
