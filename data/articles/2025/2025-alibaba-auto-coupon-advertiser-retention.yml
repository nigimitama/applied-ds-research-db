summary_ja: 広告プラットフォームで広告主の離脱を防ぐため、入札中にインプレッション単位の仮想クーポンを配布するAuto-Couponモジュールを提案。フィードバック制御と強化学習で配布を個別化し、大規模オンラインテストで広告主の継続意向が高まったとしている。
problem: 広告プラットフォームでは広告主の維持が長期成長に重要だが、広告主を引き留める手法はほとんど研究されていない。
approach: 広告主調査とデータ分析から短期の広告成果指標を維持目標として定義し、問題を二段階に分解。フィードバック制御と強化学習で、入札時の仮想クーポン配布を個別化した。
