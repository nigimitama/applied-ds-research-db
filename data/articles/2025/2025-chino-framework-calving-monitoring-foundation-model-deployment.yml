summary_ja: 繁殖牛の分娩を監視映像から検知する基盤モデルと、農家向け通知インターフェースを開発し、シミュレーション実験と畜産農場での実運用で評価した。予測結果とその根拠を直感的に示すことで農家の判断を支援する。
problem: 分娩介助には予測精度だけでなく、予測の理由が農家にわかりやすく示されることが必要。
approach: 分娩介助の判断過程を取り込んだ基盤モデルを設計し、それに基づいて分娩の兆候を検知してリアルタイムで通知するシステムを構築した。予測とその根拠を提示する。
