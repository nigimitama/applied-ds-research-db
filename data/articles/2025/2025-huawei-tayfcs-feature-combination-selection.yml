summary_ja: CTR予測などで有効な特徴の組合せを、テイラー展開による寄与推定とロジスティック回帰での冗長除去で、少ない計算で選ぶ手法を提案した。公開データで評価し、オンラインA/Bテストも報告している。
problem: 精度の高い特徴組合せ選択は、特徴の追加・削除と大規模データでの再学習の繰り返しが必要で計算コストが大きい。
approach: フィールド単位のテイラー展開で1回の逆伝播から組合せの寄与を見積もるスコアラーと、冗長特徴を除くロジスティック回帰による削減を組み合わせる。
