summary_ja: 個体差を吸収する調整機構を持つ製品の最終性能調整を、回帰モデル・因果推論・数理最適化・実測値フィードバックを組み合わせて最適化する手法を提案した。熟練者の勘に頼る調整工程の自動化を狙う。
problem: 部品の積み重ねや組立のばらつきで製品ごとに初期状態が異なり、調整パラメータと性能パラメータが複数あると調整パターンが指数的に増える。調整が作業者の熟練に依存している。
approach: 多層回帰ネットワークで調整パラメータと性能の関係をモデル化し、因果推論と数理最適化で調整量を決める。調整後の実測値をフィードバックしてバイアスを補正する。
