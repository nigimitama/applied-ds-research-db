summary_ja: Baiduの動画検索で、低品質な動画が上位に表示される問題に対し、複数の枝で品質の側面を分担して学習する品質評価ネットワークを提案した。検索システムに組み込んで評価している。
problem: 動画検索では、画質や内容の質が低い動画が結果に混ざるとユーザー体験が悪化する。品質には複数の側面があり、単一のスコアでは捉えにくく、産業規模の動画群に対する評価も難しい。
