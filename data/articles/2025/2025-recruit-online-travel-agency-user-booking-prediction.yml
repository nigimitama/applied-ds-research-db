summary_ja: オンライン旅行代理店で、ユーザーの過去の予約・キャンセル履歴と属性から次の宿泊予約の時期と確率を予測する手法を検討した。実データで複数のモデルと確率較正手法を比較している。
problem: 大規模サービスでは新規獲得だけでなく既存ユーザーとの関係維持が長期収益に重要だが、全ユーザーに一律の施策を打つのは非効率。
approach: 予約・キャンセル履歴と人口統計情報からユーザー単位の次回予約時期を予測し、確率較正手法を比べて予約確率を適切に推定する。
