summary_ja: WeChatミニゲーム広告向けに、ユーザーのLTVを予測するGRePO-LTVを提案した。グラフ表現学習でデータ疎性に対処し、期間の異なる予測タスク間の依存をパレート最適化で扱う。オフラインデータ評価とオンラインA/Bテストで効果を確認している。
problem: 広告主にとってLTV予測は重要だが、登録ユーザーのうち購入するのは約0.1%と疎で、教師信号が乏しい。また3日・7日など期間の異なる予測タスクは強く相関しており、外れ値が双方の精度を損なう。
approach: グラフ表現学習でデータ疎性を緩和し、期間別のLTV予測を相互依存するマルチタスクとみなしてパレート最適化でバランスさせるGRePO-LTVを用いる。
