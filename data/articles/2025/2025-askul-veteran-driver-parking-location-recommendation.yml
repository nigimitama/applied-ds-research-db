summary_ja: ベテランドライバーが選ぶ駐車場所の知識を使い、新人ドライバー向けに駐車場所を推薦するアルゴリズムを提案した。配送先住所と駐車位置のデータベースから信頼できる駐車位置を選び、未登録の建物には近隣の駐車位置を当て、複数配送先は駐車位置を共有できるようクラスタリングで集約する。
problem: ドライバーの時間外労働規制(2024年問題)でEC物流の人手不足が深刻になり、新人の採用が必要だが、新人は最適な駐車場所を知らず効率が下がる。
approach: 過去の駐車実績から近接性に着目して信頼できる駐車位置を選定し、未登録建物には近隣位置を割り当て、複数の配送先が1つの駐車位置にまとめられる場合はクラスタリングで集約する。
