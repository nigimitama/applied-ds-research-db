summary_ja: 医療データベース(MDV)の病院請求データを使い、子宮内膜症の新規診断前後のパターンをクラスタリングで分析した。診断前に誤診されやすい疾患の診断が増える傾向や、鎮痛薬処方の増加に伴うエコー検査の有用性、精神疾患の併存を示唆している。
problem: 子宮内膜症は早期診断と身体面・精神面を含む包括的な治療計画が求められる。
approach: 日本の病院請求データベースで、診断前後の診断・処方・処置パターンを記述的に分析し、クラスタリングで要因を探る。
