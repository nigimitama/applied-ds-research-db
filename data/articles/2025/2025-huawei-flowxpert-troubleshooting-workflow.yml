title: 'FlowXpert: Expertizing Troubleshooting Workflow Orchestration with Knowledge Base and Multi-Agent
  Coevolution'
title_ja: 'FlowXpert: ナレッジベースとマルチエージェント共進化によるトラブルシュート手順の自動構成'
published: '2025-08-03'
collected: '2026-11-09'
companies:
- huawei
source:
  type: conference
  venue: KDD Applied Data Science Track
evidence: peer_reviewed
lang: en
summary_ja: クラウドのインシデント対応で、障害対応の手順(ワークフロー)をLLMで自動構成するFlowXpertを提案。オフラインのナレッジベースと、プランナーとスコアラーが互いを改善する共進化を組み合わせ、Huawei
  Cloudのデータセンターネットワークで10週間運用した。
problem: LLMによるワークフロー構成は、障害対応に必要な専門知識やドメイン要件、AIによるフィードバックの信頼性を十分に扱えていない。
