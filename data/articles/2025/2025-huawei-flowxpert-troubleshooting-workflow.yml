approach: 運用文書からオフラインのナレッジベースを構築し、プランナーとスコアラーのマルチエージェント共進化で学習する。スコアラー出力をPPOの報酬、手順の選好ペアをDPOに用いる(発表スライドの記述)。
result: Huawei Cloudのデータセンターネットワークで10週間展開し、オンコール担当者とAI実行器を支援。Huawei Cloudのスイッチ運用文書によるベンチマークOpsFlowBenchで評価。
