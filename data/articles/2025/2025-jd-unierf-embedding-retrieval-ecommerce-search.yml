summary_ja: ECサイト検索で、パーソナライズ・意味・類似商品の各検索モジュールを統一アーキテクチャで同時学習するUniERFを提案した。JDのアプリとサイトでのオンラインA/Bテストで効果を確認している。
problem: 検索の各リトリーバを個別に学習すると、モジュール間で知見を共有できず汎化性能の面でも不利になる。
approach: ユーザー・クエリ塔とアイテム塔の二塔構成で複数の検索モジュールを共同学習し、一様安定性に基づく汎化誤差の上界も示す。
