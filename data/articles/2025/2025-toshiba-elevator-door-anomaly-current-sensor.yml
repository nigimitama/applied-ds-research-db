summary_ja: 低コスト電流センサの波形からエレベーターのドア異常の予兆を検知する診断システムの試作を報告している。波形の再現性が低い問題に、ローパスフィルタと波形抽出を加えたROCLTS(頑健な一クラス時系列シェイプレット学習)で対応し、正常波形20本の学習でも十分な検知性能を得た。
problem: 昇降機の稼働台数と経年が増える一方で保守要員は不足しており、安全を保ちながら保守を効率化する必要がある。低コストセンサの波形は再現性が低く、検知性能が下がる。
approach: 電流波形にローパスフィルタと波形抽出を施し、Robust One-Class Learning Time-series Shapelets(ROCLTS)で異常予兆を検知する。
