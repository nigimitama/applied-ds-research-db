summary_ja: ショート動画推薦で、文脈の影響とユーザーフィードバックの依存関係を相互情報量で考慮しつつ、教師モデルから実運用向けの生徒モデルへ知識を蒸留する手法MIKDを提案している。
problem: 通常の知識蒸留は、ユーザーごとに異なる文脈効果とフィードバックの依存関係を捉えられず、実運用のランキングモデルの蒸留で効果が限定される。
approach: 相互情報量により文脈情報とコンテンツ情報の寄与を重み付けし、教師モデルのソフトラベルをデプロイ可能な生徒モデルに伝える。
