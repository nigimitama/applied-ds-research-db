title: 'ROMA: Recommendation-Oriented Language Model Adaptation Using Multi-Modal Multi-Domain Item Sequences'
title_ja: 'ROMA: マルチモーダル・マルチドメインの商品系列を用いた推薦指向の言語モデル適応'
published: '2025-08-03'
collected: '2026-11-09'
companies:
- huawei
collab_academia: true
