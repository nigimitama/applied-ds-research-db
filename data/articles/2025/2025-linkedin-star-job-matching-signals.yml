summary_ja: LinkedInの求人マッチングで、LLMによるテキスト理解とGNNによる関係情報を組み合わせた埋め込み構築システムSTARを提案した。適応的サンプリングやバージョン管理など産業規模の工夫を含み、本番推薦への展開方法と知見をまとめている。
problem: 求人推薦ではコールドスタート、フィルターバブル、候補者と求人のマッチングに生じるバイアスが課題となる。会員プロフィールや求人票のテキストと、ネットワーク上の関係情報の両方を活かす必要があった。
approach: 会員・求人のテキストをLLMで扱い、GNNでグラフ上の関係を捉えてネットワーク効果によりコールドスタートを緩和する。適応的サンプリングとバージョン管理を備え、大規模推薦システムで埋め込みを構築・運用する手順としてまとめた。
