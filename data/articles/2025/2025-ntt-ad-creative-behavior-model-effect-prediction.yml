summary_ja: 新しい広告クリエイティブは過去の配信実績がなく効果予測が難しい。過去の別キャンペーンのクリエイティブ情報と配信結果を学習した大規模行動モデルで、新クリエイティブの配信効果を間接的に予測できることを確認した。
problem: 広告主は配信効果の高いクリエイティブを選びたいが、新規クリエイティブには配信実績がなく予測できない。
approach: 過去キャンペーンのクリエイティブ情報と配信結果を用いて大規模行動モデル(Transformer)を学習し、新クリエイティブの効果を間接的に予測する。
