id: 2025-china-mobile-uomo-traffic-forecasting
url: https://doi.org/10.1145/3711896.3737272
title: 'UoMo: A Universal Model of Mobile Traffic Forecasting for Wireless Network Optimization'
title_ja: UoMo:無線ネットワーク最適化のためのモバイルトラヒック予測の汎用モデル
published: '2025-08-03'
collected: '2026-11-09'
companies:
- china-mobile
collab_academia: true
source:
  type: conference
  venue: KDD Applied Data Science Track
evidence: peer_reviewed
lang: en
summary_ja: 複数都市のモバイルトラヒックの短期・長期予測と生成を1つで扱う、Transformerベース拡散モデルUoMoを提案した。China Mobileの基盤に載せ、南寧で基地局展開やスリープ制御に使われている。
problem: 都市やタスクごとに別モデルが必要になりがちで、汎用的に使えるトラヒック予測モデルが無線ネットワーク最適化には求められる。
approach: 時空間マスクと、トラヒックパターンと都市文脈を結ぶコントラスト学習を用いた拡散型Transformerで、転移学習を可能にする。
