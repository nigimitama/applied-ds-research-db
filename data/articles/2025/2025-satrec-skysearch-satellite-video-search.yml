summary_ja: 気象予報官が現在の状況に似た過去の衛星動画を探せる検索システムSkySearchを開発した。自己教師あり学習で動画を埋め込みにし、グラフで高速検索する。韓国気象庁で運用されたとされる。
problem: 高解像度の衛星動画は量が大きく、ラベルもなく、10年超のアーカイブから類似の気象状況を素早く探すのが難しい。
approach: 自己教師あり学習で動画を低次元埋め込みに圧縮し、グラフを構築して近傍探索を行う。予測した将来フレームでクエリを拡張もできる。
