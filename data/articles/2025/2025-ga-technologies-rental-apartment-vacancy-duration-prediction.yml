summary_ja: 賃貸物件の家賃設定のため、公開サイトの空室掲載データと大手ワンルーム管理会社の独自データを使い、LightGBMとベイズ階層生存時間モデルを組み合わせて空室期間を予測した。この種のデータとして期待できる水準の精度で予測できたと報告している。
problem: 家賃を高く設定すると空室が長引き、低くするとキャッシュフローが悪化するため、家賃と空室期間を併せて考える必要がある。
approach: 公開サイトの空室情報と管理会社の独自データから、物件特性と掲載家賃を入力にLightGBMとベイズ階層生存時間モデルを組み合わせて空室期間を予測する。
