summary_ja: 単一スロット推薦では、アイテム側より情報量の多いユーザー側特徴にモデルが偏るショートカットが生じる。ユーザー表現のクラスタリング補助タスクとマルチタワー構造を組み合わせて解消し、Meituanに適用してオフライン・オンライン実験で改善を報告している。
problem: 1回に1アイテムだけ提示する単一スロット推薦では、ユーザーの固有傾向がアイテム非依存のショートカット的な偏りとして学習され、推薦精度を損なう。
approach: ユーザー表現に対する深層埋め込みクラスタリングの補助タスクと、クラスタごとの嗜好を扱うマルチタワー構造を組み合わせ、学習安定化のための遅延パラメータ更新を導入する。
