summary_ja: 同時に表示される商品同士が互いに選択に影響することを考慮して、Transformerでリスト内の他アイテムの特徴を踏まえたスコアを予測し、貪欲法でレコメンドリストを生成する手法を提案した。
problem: 従来のバンドル推薦はリスト全体の最適化を狙うが、ユーザーが実際に見る範囲でのアイテム間の相互影響を明示的に扱う研究は少ない。リスト最適化は組合せ爆発も起きる。
approach: ユーザーが同時表示の商品を見比べて選ぶ行動をモデルに組み込み、Transformerで他アイテムの特徴を踏まえてスコアを予測する。リスト生成は計算可能な時間で済む貪欲法を使う。
