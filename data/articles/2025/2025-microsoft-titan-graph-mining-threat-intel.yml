summary_ja: 脅威インテリジェンスを大規模に生成するグラフマイニング基盤TITANを提案した。動的グラフ、古い情報の減衰と削除、評判伝播を備え、Microsoftのセキュリティ運用基盤に統合されている。
problem: サイバー脅威の情報は膨大で変化が速く、大規模に最新の脅威インテリジェンスを維持するのが難しい。
approach: 動的な脅威インテリジェンスグラフ、リアルタイム更新で古い情報を減衰・剪定する仕組み、評判伝播(ラベル伝播が有効)を組み合わせる。
