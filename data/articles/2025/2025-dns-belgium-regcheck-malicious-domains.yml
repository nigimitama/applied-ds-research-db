summary_ja: ドメイン登録時点で入手できる情報から機械学習で不正リスクを採点し、疑わしい登録に追加確認を求めるRegCheckを開発した。.beレジストリで2024年3月からリアルタイム運用されている。
problem: 悪意あるドメインは登録後に悪用されてから対処されがちで、登録時点で事前に不審な申請を見つけて抑止することが求められる。
approach: 過去の登録データから、新規登録が不審かを予測する分類器を学習し、登録時のリアルタイム判定に組み込む。フラグが立った登録は有効化前に追加検証を受ける。
