title: Enhanced Insurance Claim Prediction via Decoupled Graph Neural Networks with Pseudo Labeling
title_ja: 疑似ラベルを用いた分離型GNNによる保険請求予測の高度化
published: '2025-08-03'
collected: '2026-11-09'
