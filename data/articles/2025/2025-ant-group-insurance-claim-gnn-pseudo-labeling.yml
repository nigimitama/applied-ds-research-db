summary_ja: 保険の請求額(回帰)をグラフで予測するGClaimを提案。グラフを潜在クラスタに分解して個別に学習し、不確かな未ラベルノードに疑似ラベルを付与する。Alipayの自動車保険プラットフォームに導入し効果を確認している。
problem: 請求額予測は高リスク顧客の特定や公正な保険料設定に重要だが、GNNは請求額の回帰には適用されてこなかった。異質性と同質性が混在するネットワーク、ラベルの不足、ラベルの不確実性が障害となる。
approach: GClaimはグラフを潜在クラスタに分解して各クラスタを独立に学習する。不確かな未ラベルノードには、標準偏差に基づく基準で選別した疑似ラベルを加える。
result: 産業データと公開データでベースラインを上回る。Alipayの自動車保険プラットフォームで、エンドツーエンドの転換率が10%超、UV価値が25%向上。
