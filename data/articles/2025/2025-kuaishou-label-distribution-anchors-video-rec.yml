summary_ja: 短尺動画推薦の視聴時間予測で、動画の長さごとの視聴比率の分布をVQ-VAEでアンカー化し、最適輸送で擬似ラベルを生成する手法を提案。オフライン評価に加え、大規模ショート動画プラットフォームでのオンラインA/Bテストで有効性を確認している。
problem: 視聴時間予測では動画の長さによって視聴比率の分布が異なり、複数のピークを持つため、単純な回帰ラベルでは分布の特性を捉えにくい。
approach: 動画長のグループごとの視聴比率分布をVQ-VAEで代表的なアンカーに変換し、最適輸送(Optimal Transport)でアンカーに整合した擬似ラベルを作って学習に用いる。
