summary_ja: 販売・生産・在庫計画で、販売予測の不確実性をSequential Predictive Conformal Inference(SPCI)で推定して安全在庫の決定に使った。状態空間モデルより在庫水準を下げつつ欠品リスクを抑えられることを実験で確認している。
problem: 安全在庫の水準は販売予測の不確実性に左右される。従来の状態空間モデルは残差の対称分布を仮定し、データ効率も低い。
approach: 残差を非パラメトリックに推定するSPCIで予測区間を求め、その区間を安全在庫の設定に用いる。
