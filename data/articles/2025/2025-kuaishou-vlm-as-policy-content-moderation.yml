summary_ja: 短尺動画の有害コンテンツ審査に、判例に基づく考え方を取り入れ、視覚言語モデルと思考連鎖で判定するKuaiModを提案した。Kuaishouの複数シナリオでA/Bテストを行っている。
problem: 未成年に有害な動画などの審査は、固定ルールでは社会の変化に追随しにくく、動画の量が膨大である。
approach: 過去の事例を判例として参照する枠組みで、社内VLMにChain-of-Thought推論を行わせて審査し、利用者フィードバックと人手審査から評価データを作る。
