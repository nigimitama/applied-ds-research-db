summary_ja: 短尺動画とライブ配信が混在するフィードで、ライブ配信を差し込む判断を強化学習で行うSL-MGACを提案した。教師あり報酬学習と状態分解でTD誤差の蓄積と分散を抑え、オフライン評価とオンラインA/Bテストで検証している。
problem: ライブ配信の割当は直後のフィードバックだけでは長期的な悪影響を見落としやすく、プラットフォーム全体の制約下で安定した方策が必要。
approach: 批評家学習に教師あり報酬学習を加えTD誤差の蓄積を抑え、アクターと批評家にマルチグループ状態分解を導入。過度に貪欲な割当を防ぐ報酬関数も設計した。
