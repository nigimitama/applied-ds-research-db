summary_ja: Alipay上の医療保険について、申請から調査・交渉までのクレーム処理全体を自動意思決定モジュールで支える管理システム。案件のリスク層別化と、予算制約下での調査リソース配分を組み合わせ、不正請求と運用コストの抑制を狙う。
problem: 医療保険のクレーム処理では不正請求への対応と管理コストの抑制が課題で、限られた調査リソースをどの案件に割り当てるかの最適化が必要になる。
approach: 案件ごとのリスクを初期審査で評価する層別化モジュールと、高リスク案件に予算内で調査リソースを割り当てる配分モジュールを、クレーム処理の各段階に組み込む。
