summary_ja: マネーロンダリング対策として、Intesa Sanpaoloの20億件超の匿名化取引に対する教師なし異常検知パイプラインを開発し、同行の取引モニタリングシステムに本番導入した。専門家による検証で既存のルールベースを上回る成果を確認している。
problem: AML(資金洗浄対策)の取引監視は従来ルールベースが中心で、見逃しが多い。ラベルが乏しい大規模取引データから不審口座を見つける必要がある。
approach: 8か月分、20億件超の匿名化された銀行取引データで教師なし異常検知パイプラインを設計・チューニングし、銀行の専門家がルールベースシステムとの比較や新規検知案件のレビューで評価した。
tags:
