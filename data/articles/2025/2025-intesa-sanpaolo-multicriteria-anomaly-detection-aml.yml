  - log
confidence: 0.85
result: 高リスク案件の適合率・再現率が6倍に向上。支店長が手作業で見つけていたがルールでは検知できなかった200件超のアラートを追加で検知し、未報告の100件の手動レビューで28件の重要案件を発見したと報告。
