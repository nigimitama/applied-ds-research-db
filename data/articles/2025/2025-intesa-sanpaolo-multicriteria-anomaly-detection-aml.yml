title: 'MAD: Multicriteria Anomaly Detection of Suspicious Financial Accounts from Billions of Cash Transactions'
title_ja: 'MAD: 数十億件の現金取引からの不審口座のマルチクライテリア異常検知'
published: '2025-08-03'
collected: '2026-11-09'
