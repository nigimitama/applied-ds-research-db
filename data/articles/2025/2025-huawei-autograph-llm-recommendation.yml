summary_ja: 推薦用のグラフをLLMで自動構築するAutoGraphを提案。LLMで得たユーザー嗜好とアイテム知識のベクトルを量子化して潜在因子ノードを作り、ユーザーとアイテムを結ぶ。Huaweiの広告プラットフォームに導入された。
problem: GNN推薦は事前定義のグラフに依存し、既存のLLM活用手法は全体視点を欠き構築も非効率である。
approach: LLMでユーザー嗜好とアイテム知識を意味ベクトル化し、ベクトル量子化で潜在因子を抽出して追加ノードとしてグラフに組み込み、メタパスに基づくメッセージ集約で意味情報と協調情報を統合する。モデル非依存。
