summary_ja: プラントや産業設備の運転モードや外気温の変化で内部状態が動的に変わると、従来の機械学習は誤検知や精度低下を起こす。学習データを動的に更新する技術を適用し、設備の運用環境に合った学習データを動的に選んで高精度な分析を実現する手法を開発した。
problem: 運転データを使う設備分析では、運転モードや外気温の影響で状態が動的に変化し、誤検知や分析精度の低下が起こる。安定で高精度な分析は顧客価値に直結する。
approach: 設備の変化する運用環境に合わせて、学習に用いるデータセットを動的に選択・更新する。
