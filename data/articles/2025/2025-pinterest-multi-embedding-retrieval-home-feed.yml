summary_ja: ユーザーごとに複数の埋め込みを生成し、履歴由来の暗黙の興味と、フォロー等の明示的な興味を併用する検索フレームワークをPinterestのホームフィードに導入した。A/Bテストでエンゲージメントと多様性の改善を確認している。
problem: 従来の二塔モデルはユーザーとアイテムの特徴相互作用が限られ、主要な興味に偏りロングテールの興味を捉えにくい。
approach: 微分可能クラスタリングモジュールで行動履歴から暗黙の興味埋め込みを得て、フォロー中トピックなど明示的興味は条件付き検索で扱う。
