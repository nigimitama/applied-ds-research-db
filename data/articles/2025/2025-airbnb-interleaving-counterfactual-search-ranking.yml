summary_ja: Airbnbの検索ランキング改善で、予約のような稀なイベントではA/Bテストの検出に時間がかかる問題に対し、インターリービングと反事実評価を導入した。有望な候補を素早く絞り込み、本番運用での知見も共有している。
problem: A/Bテストは予約などの稀な指標で統計的検出力に達するまで時間がかかり、オフライン評価は速いが精度が低くA/Bテスト候補の選別に向かないため、ランキング開発の反復が遅くなる。
approach: インターリービングと反事実評価の手法を整備し、A/Bテストにかける前に有望なランキング候補をオンラインで迅速に評価する実験プロセスを構築した。
result: 手法やメトリクスにより、従来のA/Bテストに比べて実験の感度が最大100倍向上したと報告。
