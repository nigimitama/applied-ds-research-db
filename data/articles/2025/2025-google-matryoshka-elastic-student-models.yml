summary_ja: 1回の学習で、サービング費用と精度のトレードオフが異なる複数の生徒モデルを得る蒸留枠組みMatTAを提案した。教師と生徒の間にTA(助手)モデルを置き、そこから入れ子状の生徒モデルを取り出す。自社データとGPT-2
  Mediumで評価し、本番MLシステムでのライブA/Bテストでも効果を確認した。
problem: 本番では精度と推論コストの兼ね合いで複数サイズのモデルを提供したいが、サイズごとに別々に蒸留すると学習コストがかさみ、小型モデルの精度も伸びにくい。
approach: 教師-TA-生徒の3段構成のMatTAを用いる。生徒より容量の大きいTAが教師との整合とドメイン知識の取り込みを担い、生徒モデルはTAに入れ子で含まれるため、1回の学習から複数の配備可能な生徒を抽出できる。
result: GPT-2 MediumでSAT Mathが相対24%超、LAMBADAが10%超改善。本番MLシステムのライブA/Bテストで主要指標が20%改善したと報告。
