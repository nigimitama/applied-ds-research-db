summary_ja: ELECTRA型の識別器による事前学習をLearning-to-Rankに初めて取り入れたとする枠組みRankElectraを提案。ラベル不足を補うため、グラフ拡張とベクトル化、事前学習、ファインチューニングの3段階でWeb規模検索の順位付けを改善する。
problem: Web検索のランキングでは人手ラベルが不足しており、大規模な未ラベルのクリックグラフなどを活用した事前学習が求められる。
approach: グラフ拡張・ベクトル化で擬似的な訓練データを作り、ELECTRA風の識別器を事前学習した上でLTRタスクにファインチューニングする。
