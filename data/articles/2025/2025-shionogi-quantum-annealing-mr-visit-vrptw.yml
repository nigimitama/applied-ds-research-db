summary_ja: 医薬情報担当者(MR)の医療施設訪問計画を、時間窓制約付き運搬経路問題(VRPTW)としてQUBOで定式化し、量子アニーリングで解いた。担当MR数・施設間距離・訪問時間制約などを考慮している。
problem: MRは複数の医療施設を訪問する必要があり、地域によって長距離移動や訪問時間の制約がある。多数の制約下で最適な訪問計画を作るには大規模な計算が必要になる。
approach: 担当MR数・施設間距離・訪問時間枠などをQUBOで定式化し、量子アニーリングで求解する。
