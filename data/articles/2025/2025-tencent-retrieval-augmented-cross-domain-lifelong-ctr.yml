summary_ja: 対象ドメインの行動履歴が乏しい場合に、他ドメインの長期行動を検索して利用するRAL-CDNetを提案した。事前学習言語モデルによるアイテムのテキスト情報で検索を改善し、WeChat広告でオンライン検証したとされる。
problem: 対象ドメインで履歴が豊富でないことが多く、クロスドメインの生涯的な行動モデリングが見過ごされてきた。
approach: クロスドメイン検索ユニット、アライメントユニット、クロスネットで構成。検索ユニットは言語モデルによるアイテムテキスト表現で他ドメイン行動を取得する。
