summary_ja: 一定量の資産を将来期間に最小コストで取得する資金配分問題で、予測と最適化を端末間で学習するRTS-PnOを提案した。予測の不確実性を適応的に補正し、Tencentの国際送金事業でオンライン評価している。
problem: 予測のみ、あるいは予測後に最適化する方法は目的の不一致があり、予測モデル自体の不確実性も加わるため、資金配分のタイミング決定が難しい。
approach: 予測モデルに依存しない枠組みで、目的との整合を測る指標でエンドツーエンドに学習し、予測の不確実性を適応的に較正する。
