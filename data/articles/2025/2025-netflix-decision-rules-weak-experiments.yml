confidence: 0.85
alt_urls:
- https://arxiv.org/abs/2502.08763
approach: ルールの累積リターンを推定する交差検証ベースの推定量を設計し、プラグイン推定より偏りを小さくする。
result: 123件のNetflix過去A/Bテストで、新しい決定ルールにより累積リターンが推定33%向上し、ルールの採用につながった。
