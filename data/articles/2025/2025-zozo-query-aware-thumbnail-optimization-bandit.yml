title: Eコマース検索結果におけるクエリに応じたサムネイル最適化に関する実験的研究
published: '2025-07-01'
collected: '2026-11-10'
companies:
- zozo
collab_academia: false
source:
  type: conference
  venue: 人工知能学会全国大会
evidence: peer_reviewed
lang: ja
summary_ja: ファッションECの検索結果で、同じ商品内のどのサムネイル画像がクリックされやすいかを実プラットフォームで実験した。サムネイルによりCTRに有意な差があり、検索クエリに紐づく性別で最適な画像が異なること、性別別のCTR分布に基づくトンプソンサンプリングで報酬が改善することを示した。
problem: 検索結果のサムネイルはクリック行動に影響するが、同一商品内でどの画像が効果的か、またクエリに応じて最適な画像が変わるかは十分に調べられていない。
approach: 実際のファッションECで複数のサムネイルを出し分けてCTRを収集・分析し、そのデータに多腕バンディット(トンプソンサンプリング)を適用して、クエリに応じたサムネイル選択を検討した。
