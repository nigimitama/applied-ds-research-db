summary_ja: 商品・短尺動画・投稿など異なる種類のエンティティが混在するフィードで、エンティティ間の知識を転移する事前学習+ファインチューニング型の枠組みMKTを提案。XianyuのデータでオフラインとオンラインのA/B実験により既存手法を上回ったと報告している。
problem: エンティティごとにデータ分布が異なり負の転移が起きやすく、価格のように一部のエンティティにしかない特徴があるため、ネットワークを共有した同時学習が難しい。
