approach: 特徴を整列・スケーリングする事前学習モジュールと、共通知識とエンティティ固有知識を分離する抽出器を用い、共通知識を使って対象エンティティのモデルを学習する2段階の転移を行う。
result: オフライン・オンライン実験で複数の最先端手法を上回ると報告(具体値は原文参照)。
