- bytedance
source:
  type: conference
  venue: KDD Applied Data Science Track
evidence: peer_reviewed
lang: en
summary_ja: 推薦・検索・広告のコンテンツ理解向けに、能動学習の効率を高めるkNNベースの潜在空間拡張と、既存のビジョン言語モデルへ音声を足す中間融合VLMAEを提案した。本番環境に展開し事業上の効果があったと報告している。
problem: ラベル付きデータの質と各モダリティの融合が精度を左右するが、従来の能動学習は自信を持って誤る例や類似アイテムの区別に弱い。ショート動画では音声が重要だが、事前学習モデルの多くはテキストと画像のみを扱う。
approach: kNNに基づく潜在空間拡張でラベリング対象を選ぶ能動学習を改善し、VLMAEで音声特徴を既存のビジョン言語モデルに中間融合する。
