summary_ja: 再生可能エネルギーと系統用蓄電池を組み合わせた電力アービトラージ取引で、価格・日射量の予測誤差を考慮した計画作成法を提案した。過去1年分の日次計画を実績データで評価し、利益が5.4%改善することを確認している。
problem: 価格や日射量の予測を使って利益最大の計画を作っても、予測誤差で利益が下がるリスクがある。
approach: 予測の不確実性をシナリオとして生成し、ポートフォリオ理論の考え方を取り入れて、不確実性を考慮した発電・取引計画を作る。
