summary_ja: ユーザーのセッション中の広告の密度や種類を個別に調整し、体験と収益化のバランスを取る問題を、マルコフ決定過程として扱いオフライン強化学習で解いた。分布シフトに強いロバストなデュエリングDQNを提案し、本番データで評価後にA/Bテストで検証している。
problem: 広告の量をセッションごとに動的に決めることで、ユーザー体験と広告収益を両立させたい。しかし過去ログは過去の広告配信方針に由来する交絡バイアスを含み、オンラインで自由に探索もできないため、ログのみで学習する必要があり分布シフトにも弱い。
approach: セッション単位の広告量決定をMDPとして定式化し、オフラインDQNで学習する。交絡バイアスの対策として過去セッションでの広告量決定を状態に含め、分布シフトへの対策としてオフラインのロバストなデュエリングDQNを導入した。
result: 本番データでロバストDQNのAUCCが非ロバストDQNに対し5%、メタラーナーに対し25%改善。ローンチ後のA/Bテストでエンゲージメントと広告スコアのトレードオフ効率が二桁改善と報告
