summary_ja: 推薦プラットフォーム上の広告で、チャネル推薦と予算配分を同時に扱うマルチタスクのオフライン強化学習モデルMTORLを提案した。Taobaoでの導入を想定した実験で、既存手法より良い結果とオンラインA/Bテストでの改善を報告している。
problem: 広告が疎な環境では既存のオフライン強化学習が過大評価や分布シフトに弱く、予算制約も十分に扱えない。チャネル推薦と予算配分は互いに関係するが別々に扱われがちだった。
approach: 広告向けのマルコフ決定過程を定義し、因果的な状態エンコーダと因果アテンションでユーザー興味の変化を捉える。行動と報酬をマルチタスクで同時にデコードし、チャネル推薦と予算配分を一つのモデルで学習する。
result: オフライン・オンラインの実験で最先端手法を上回ると報告。Taobaoの1%トラフィックで48時間のA/Bテストを行い、RPMが0.23%向上したと記載。
