lang: ja
summary_ja: 雑音環境下で産業機械の異常音を頑健に検知する深層学習モデルを検討した。4種類の機械の稼働音データでACRNNとLiquid Neural Networkをベースライン(ResNet18)と比較し、間欠的な音にはACRNN、連続的な音にはLNNが有効であることを確認した。
problem: 異常音は機械の製品や部品の種類によって異なり、騒音の中で発生する。故障の早期検知で保全を効率化するため、雑音に頑健な検知が必要。
approach: 産業機械の稼働音(正常・異常、4種類)で、ACRNN(Attention付き畳み込みリカレント)とLiquid Neural Networkを構築し、ResNet18と比較した。
