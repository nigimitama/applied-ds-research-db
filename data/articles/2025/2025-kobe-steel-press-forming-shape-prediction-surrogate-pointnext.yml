summary_ja: プレス金型の設計で、FEM解析の結果から成形品形状を予測するサロゲートモデルを、点群向け深層学習モデルPointNeXtで構築した。数分で平均誤差約0.3mmの予測ができ、実用的な精度を満たすとしている。
problem: プレス金型設計はFEM解析に基づく修正と再解析を繰り返すが、計算コストが高く部品形状も複雑化して、設計サイクルが長引いている。
approach: 金型形状とプレス後の成形品形状の関係を、3D点群の分類・セグメンテーション向けモデルPointNeXtで学習してFEM解析の代わりに予測する。
