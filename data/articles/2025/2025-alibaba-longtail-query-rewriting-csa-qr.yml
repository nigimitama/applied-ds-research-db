summary_ja: EC検索で、ユーザーの表現と出品者の商品名のずれが大きいロングテールクエリを、LLMで書き換えて検索精度を高めるCSA-QRを提案。Taobaoに導入され、オンラインA/Bテストで成果を確認している。
problem: EC検索ではユーザーの言い回しと出品者の商品名に乖離があり検索がうまくいかない。既存のLLM書き換えは大半のクエリでは有効だが、複雑な意味を持つロングテールクエリには効果が薄い。
approach: 3段階のCSA-QR。汎用LLMで書き換え候補を生成し人手で判別、既存アノテーションを使ったRAGで高品質なSFTデータを作成。フィードバックをユーザー意味整合性と出品者表現整合性の2次元に分解して整合データを収集し、二値フィードバックで報酬モデルを学習して、PPOで強化学習によるアラインメントを行う。
result: オフラインで検索性能が向上し、オンラインA/Bテストでロングテールの複雑クエリのCTR、GMV、取引数が有意に改善(具体値は原文参照)。2024年9月からTaobaoに導入。
