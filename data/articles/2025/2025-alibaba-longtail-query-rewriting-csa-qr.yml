title: Complicated Semantic Alignment for Long-Tail Query Rewriting in Taobao Search Based on Large Language
  Model
title_ja: Taobao検索における複雑な意味を持つロングテールクエリ書き換えのためのLLMによる意味アラインメント
published: '2025-08-03'
