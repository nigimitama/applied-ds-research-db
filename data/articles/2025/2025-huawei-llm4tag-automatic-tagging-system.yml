summary_ja: 検索・推薦で使うコンテンツのタグ付けにLLMを用い、候補タグの網羅性、ドメイン知識への追随、信頼度の信頼性という既存手法の弱点に取り組んだ。3つの大規模産業データで評価し、オンラインのコンテンツタグ付けにも展開して数億人規模のユーザーに提供している。
problem: 検索や推薦のための自動タグ付けでは、既存のLLM活用手法は候補タグの取りこぼしが多く、新しいドメイン知識に適応しづらく、出力タグの信頼度も当てにならないという課題があった。
approach: 3モジュール構成。グラフに基づくタグ再現で関連性の高い小さな候補集合を作り、長期・短期の知識を注入するタグ生成で精度を高め、信頼度キャリブレーションで信頼できるスコアを出す。
result: 3つの大規模産業データセットで最先端のベースラインを大きく上回り、オンラインのコンテンツタグ付けに展開済みと報告(数値は原文参照)。
