title: 'LLM4Tag: Automatic Tagging System for Information Retrieval via Large Language Models'
title_ja: 'LLM4Tag: 大規模言語モデルによる情報検索向け自動タグ付けシステム'
published: '2025-08-03'
collected: '2026-11-09'
