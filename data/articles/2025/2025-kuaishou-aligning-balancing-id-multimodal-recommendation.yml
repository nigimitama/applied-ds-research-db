summary_ja: IDとマルチモーダル表現の分布ずれと収束速度の差という2つの課題に対し、MLLMを微調整して得た商品表現をID表現と整合させ、勾配調整で学習のバランスを取るAB-Recを提案した。4つのデータセットのオフライン実験と、オンライン動画プラットフォームでのA/Bテストで有効性を示している。
problem: 大規模推薦はスパースなIDに依存しデータ疎性に悩む。マルチモーダル情報で補う際、IDとの分布の不一致で直接統合するとユーザーと商品のミスマッチが起きやすく、またマルチモーダル表現はIDより収束が遅く最適化が不均衡になる。
approach: 3つの整合タスクでマルチモーダルLLMを微調整し商品ごとの統一表現を得る。バッチ内Wasserstein距離の最小化でID表現との分布を揃えつつ、同一商品の2種の表現が潰れないよう距離を保つ。さらに両表現の寄与差を監視する勾配調整で最適化を制御する。
result: 4つのデータセットのオフライン実験とオンライン動画プラットフォームでのA/Bテストで有効性と拡張性を確認と報告(具体値は未確認)。
