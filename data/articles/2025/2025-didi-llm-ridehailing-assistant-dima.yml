  method:
  - llm
  - fine-tuning
  data_type:
  - text
  - geospatial
confidence: 0.85
alt_urls:
- https://arxiv.org/abs/2503.04768
approach: 外部ツールを使って時空間の推論と段階的な計画を行う注文計画モジュール、複数の応答種別とコスト配慮型のモデル構成を持つ対話システム、実ユーザー対話とシミュレーション対話を併用した継続的ファインチューニングで構成する。
result: DiDiアプリでの実対話で注文計画の精度93%、応答生成の精度92%を報告。既存の3つのエージェント枠組みに対し、注文計画で最大70.23%、応答生成で最大321.27%の改善。
