title: 'DiMA: An LLM-Powered Ride-Hailing Assistant at DiDi'
title_ja: 'DiMA: DiDiのLLM搭載配車アシスタント'
published: '2025-08-03'
collected: '2026-11-09'
companies:
- didi
source:
  type: conference
  venue: KDD Applied Data Science Track
evidence: peer_reviewed
lang: en
summary_ja: DiDiの配車アプリに組み込まれたLLMベースの対話型アシスタントDiMAを提案した論文。時空間を考慮した注文計画、応答品質と遅延を両立する対話設計、実ユーザーとの対話とシミュレーション対話による継続的ファインチューニングを組み合わせ、実アプリ上での挙動を評価している。
problem: 配車では時刻や場所に依存する複雑な要望を、対話を通じて正確に注文へ落とし込む必要があるが、既存のエージェント枠組みでは時空間推論や応答遅延の制約への対応が難しい。
tags:
  task:
  - conversational-ai
  domain:
