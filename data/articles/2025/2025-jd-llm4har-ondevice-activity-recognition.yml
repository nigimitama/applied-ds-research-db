summary_ja: 事前学習LLMの知識をセンサーデータに転移し、ドメインをまたぐ行動認識の性能を高めるLLM4HARを提案。センサーと言語のギャップ、センサー知識の注入、オンデバイスでの軽量化に取り組み、4つの実データセットで評価しJD
  Logisticsに導入した。
problem: センサー信号と言語のドメイン差が大きく、端末のメモリ・計算制約下で動かす必要もあるため、ドメイン横断で汎化する行動認識が難しい。
