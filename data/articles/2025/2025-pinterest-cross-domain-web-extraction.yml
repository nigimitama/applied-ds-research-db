source:
  type: conference
  venue: KDD Applied Data Science Track
evidence: peer_reviewed
lang: en
summary_ja: ECサイトのページから商品属性を抽出するため、HTML要素のテキスト・スタイル・レイアウトを表現しXGBoostで判定するシステムをPinterestで構築した。GPT系より高精度で、毎秒1,000件超のURLを処理でき、コストも大幅に低いと報告している。
problem: 多様なECサイトから構造化された商品情報を抽出する必要があるが、サイトごとに構造が異なり、LLMによる抽出は大量のURL処理ではコストが高い。
approach: 各可視HTML要素をテキスト、スタイル、レイアウトの特徴で表現し、LLMではなく小型のXGBoostで属性を分類する。
