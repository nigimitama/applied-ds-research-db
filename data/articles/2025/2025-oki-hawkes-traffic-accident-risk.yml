summary_ja: 車両が連鎖的にブレーキを踏むことで生じる減速波の伝播に着目し、速度の変動係数をマークとしたマーク付きHawkes過程で交通事故リスクを定量化した。実際のプローブデータに適用して評価している。
problem: 交通事故の予兆を捉えてドライバーへの注意喚起につなげたい。減速波の伝播が事故発生と強く関連することは知られているが、これをリスク値として定量化する方法が必要。
approach: 空間内の速度が激しく時系列変化する点に注目し、速度の変動係数をマークとするマーク付きHawkes過程でリスクを算出する。
