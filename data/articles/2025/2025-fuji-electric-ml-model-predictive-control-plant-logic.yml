summary_ja: プラントは内部制御ロジックが設定値に追従するため、単純に機械学習モデルを当てはめても将来状態を予測しにくい。機械学習モデルと制御ロジックを組み合わせた予測法と、それを用いた最適な設定値の算出法を提案し、評価した。
problem: オペレータが設定する値を内部の制御ロジックが追従する構造のプラントでは、設定値の変更で挙動が大きく変わる。既存の機械学習モデルをそのまま使うと将来状態の予測が難しく、運転支援に使えない場合がある。
approach: 機械学習モデルとプラント内部の制御ロジックを組み合わせて将来状態を予測し、その予測を用いて最適な設定値を計算するモデル予測制御を構成する。
