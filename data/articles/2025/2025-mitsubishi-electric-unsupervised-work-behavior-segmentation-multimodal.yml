summary_ja: 生産現場の作業者の動作をガウス過程隠れセミマルコフモデル(GP-HSMM)で教師なしに分節化する手法を、道具や部品などの物体情報を加えたマルチモーダルに拡張した。動作データだけでは似た動作が同じクラスにまとまる限界を改善する。
problem: 生産現場の作業行動分析は目視観察に頼っており、時間と手間がかかる。動作データのみの分節化では、特徴が似ていても意味の異なる行動が同一クラスになってしまう。
approach: GP-HSMMによる教師なし分節化に、作業者が使う道具・部品などの物体データを組み合わせて分節化精度を高める。
