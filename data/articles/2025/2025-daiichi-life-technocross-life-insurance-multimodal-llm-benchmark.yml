  method:
  - llm
  - multimodal
  data_type:
  - text
  - image
confidence: 0.7
result: 文書QAでClaude 3.5 Sonnet、画像内容のテキスト化でGemini 1.5 Proが最高精度。業務データでの評価は公開ベンチマークと異なる結果になった。
