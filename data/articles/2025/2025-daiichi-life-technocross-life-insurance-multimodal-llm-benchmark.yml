summary_ja: 生命保険の問い合わせ対応業務にマルチモーダルLLMを適用するため、業務データで独自ベンチマークを作り、Claude 3.5 Sonnet・Gemini 1.5 Pro・GPT-4oを比較した。文書QAではClaude、画像内容のテキスト化ではGeminiが最高精度で、社内文書の図表で認識が難しい特徴も整理した。
problem: 公開ベンチマークの結果が自社の業務データでも成り立つとは限らず、業務への適用可否を判断するには実データでの性能評価が必要。
approach: 業務データから文書QAと画像内容のテキスト化のベンチマークを構築し、3つのマルチモーダルLLMを比較した。
tags:
  task:
