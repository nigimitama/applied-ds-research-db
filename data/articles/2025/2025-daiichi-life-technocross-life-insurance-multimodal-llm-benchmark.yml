title: 生命保険業務データによるマルチモーダルLLMの性能評価
published: '2025-07-01'
collected: '2026-11-10'
companies:
- daiichi-life-technocross
collab_academia: false
source:
  type: conference
  venue: 人工知能学会全国大会
evidence: peer_reviewed
