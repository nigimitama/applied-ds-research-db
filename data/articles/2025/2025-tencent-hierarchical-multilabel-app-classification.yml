summary_ja: アプリ名と説明文から階層的な複数ラベルを付与する分類ネットワークHMCNと、アプリ表現を判別しやすくする対照学習HMCLを提案。Tencent App Storeと公開データで評価し、Tencentに1年以上導入されている。
problem: アプリのカテゴリは階層構造を持ち複数ラベルが付くため、テキストだけから正確に分類するのは難しい。
