summary_ja: 旅行プラットフォームFliggyで、売り切れた客室タイプに在庫を臨時追加すべきかを予測する課題に対し、支払い受諾の同時予測、データ拡張、対照学習を組み合わせたフレームワークCL4IAPを提案している。
problem: 在庫を追加するホテルが少なく、さらに追加が予約に結びつく例はもっと少ないため、学習データがスパースで予測が難しい。
approach: 支払い・受諾を同時に予測するモジュール、データ拡張モジュール、インスタンス単位とクラスタ単位の損失を使う対照学習モジュールで特徴表現を強化する。
