summary_ja: Alibaba CloudのMaxCompute等の産業用クラウドクラスタの非定常な指標から複数の周期を検出するため、経験的モード分解(EMD)に基づく手法EMD-Periodを提案した。分解、ノイズ・トレンド除去、モード混合を補正した周期推定の順で処理する。
problem: クラウドクラスタの指標は非定常で複数の周期が重なるため、従来の周期検出では精度が落ちる。
