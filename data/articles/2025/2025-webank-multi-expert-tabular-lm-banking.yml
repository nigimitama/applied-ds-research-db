summary_ja: WeBankの非公開な企業データベースを用いて、100億パラメータ規模の表形式言語モデルを限られた計算資源で事前学習・微調整するためのマルチエキスパート構造を提案。リスク評価などの銀行業務タスクでベースラインを上回ると報告している。
problem: 銀行の独自の表形式データで大規模言語モデルを学習するには計算資源の制約が大きく、効率的な事前学習・微調整の方法が必要になる。
approach: ドメインエキスパートと区分エキスパートを用意し、ゲート関数で適切なエキスパートを選択する。表は列と値のテキスト形式に直列化して言語モデルに入力する。
