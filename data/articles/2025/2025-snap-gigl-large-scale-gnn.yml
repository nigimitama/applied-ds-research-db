summary_ja: 数十億規模のグラフでGNNを扱うためのオープンソースライブラリGiGLを紹介。関係DBからのグラフ前処理、サブグラフサンプリング、分散学習、推論、オーケストレーションを一貫して提供し、Snapchatの友人推薦・コンテンツ推薦・広告で運用している。
problem: 多くのGNNライブラリはグラフが1台に載る前提で、数十億規模の実世界グラフには適用しにくく、産業利用が研究に遅れている。
