summary_ja: 半導体露光装置の故障検知に、ドメイン知識を取り込むInformed Machine Learning(IML)の枠組みを適用した。故障の発生が少なくラベル付きデータが得にくいため、従来の故障検知手法が使えない問題に対応する。
problem: 製造現場でデータ活用が広がっても、実用にはドメイン知識の統合が欠かせない。露光装置では故障の発生が少なく、ラベル付きデータが十分に得られない。
approach: ドメイン知識を機械学習に組み込む枠組みを体系化し、半導体露光装置の異常検知システムに適用した。
