summary_ja: いけす内の養殖ブリの体重を非接触で推定するため、尾叉長・体高に加えて新たな体の特徴量を探索した。約10万個体のデータセットを構築し、精度向上に効く特徴量を機械学習で特定している。
problem: 養殖では給餌量を魚群の重量から決めるため、体重推定の精度が重要。水中ステレオカメラの尾叉長と体高が主流の特徴量で、さらに精度を上げるには新しい特徴量が要る。
approach: ブリ約10万個体について尾叉長・体高・体幅と11個の候補特徴量の長さ、体重を計測したデータセットを作り、機械学習の特徴量探索で精度を高める特徴量を調べた。
