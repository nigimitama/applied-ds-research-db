title: Hierarchical Structure Sharing Empowers Multi-task Heterogeneous GNNs for Customer Expansion
title_ja: 階層的な構造共有がマルチタスク異種グラフNNを強化する:顧客拡大への応用
alt_urls:
- https://arxiv.org/abs/2410.22089
