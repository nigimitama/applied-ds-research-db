summary_ja: スマートメータの総消費電力から家電別の消費を推定するNILMで、窓ごとに分布がずれる非定常性に対処するTransformer型モデルを提案した。4つの実データで最先端手法を上回り、EDFの電力消費可視化サービスに実際に組み込まれている。
problem: 既存の深層学習NILMは世帯の時系列を固定長の窓に切って処理するが、実際のスマートメータデータは非定常で窓内の分布がドリフトし、精度が落ちる。
approach: Transformerに、部分系列を標準化・逆標準化する仕組みを組み込んで分布ドリフトを抑え、さらに部分系列のタイムスタンプのみから作る位置エンコーディング(TimeRPE)を導入した。
result: 4つの実世界データセットで最先端手法を大きく上回ると報告。EDFの消費モニタリングサービス(Mon Suivi Conso)に導入済み。
