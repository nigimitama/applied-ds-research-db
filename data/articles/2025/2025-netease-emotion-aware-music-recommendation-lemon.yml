summary_ja: NetEase Cloud Musicで、楽曲の感情的な意味合いをLLMで埋め込みに変換して推薦に用いる感情考慮型モデルを提案。感情傾向の異なる曲に時間帯特有の聴取パターンがある点に着目し、オンラインA/Bテストで検証している。
problem: 従来の音楽推薦は過去の視聴行動に偏り、ユーザーの現在の気分や楽曲の多面的な感情を捉えにくい。
