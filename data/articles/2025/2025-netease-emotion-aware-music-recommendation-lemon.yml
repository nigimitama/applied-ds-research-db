approach: 楽曲の要約とメタデータ(曲名・アーティスト・ジャンル)をLLMに入力して感情を強化したコンテンツ埋め込みを得て、オフラインで計算・保存し推薦モデルで利用する。
result: NetEase Cloud MusicのオンラインA/Bテストでユーザーエンゲージメント指標が1%向上と報告。
