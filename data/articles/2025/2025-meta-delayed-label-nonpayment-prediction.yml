summary_ja: オンライン決済で未払いを予測するモデルは、ラベルが数週間から数か月遅れて得られる。取引後のシグナルから擬似ラベルを作ってこの遅延に対処し、バイアスと分散のトレードオフを整理した。Metaの複数システムのオフライン実験と実トラフィックでの検証を報告している。
problem: 未払い予測では正解ラベルの到着が数週間〜数か月遅れる。その間にユーザー行動が非定常に変化しラベル分布もドリフトするため、古いラベルで学習したモデルが劣化する。
approach: 取引後に得られるシグナルから擬似ラベルを生成する。短期プロキシとサロゲート指標の考え方に基づき、ラベルドリフトによるバイアスの低減と、擬似ラベルのノイズによる分散増加のトレードオフを扱う。
