summary_ja: 電力会社の週次計画業務に数理最適化を適用した事例。天候・需要・電力価格の予測から複数シナリオを作り、火力・水力・揚水・原子力・太陽光・購入電力を詳細にモデル化して、発電機の起動停止計画を求める。
problem: 市場取引と多様な電源を扱う需給計画は、実運用の制約を反映するために各発電所の詳細なモデル化が要る。
approach: 予測に基づく複数シナリオを作り、各シナリオで発電機の起動停止計画を算出する2段階の最適化を行う。
