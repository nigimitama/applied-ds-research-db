summary_ja: 光学製品の組立工程で、検査で見つかった不良の原因が前工程にあり因果データがないという問題に、高次元・小サンプルのデータでも安定する異常要因推定を提案した。以前のシミュレーションベースの近似ベイズ計算法の不安定さを改善する。
problem: 不良の根本原因は前工程にあるが因果データがなく、人の経験に頼っている。以前の手法は高次元・小サンプルのデータで不安定だった。
approach: シミュレーションベースの近似ベイズ計算による原因推定を、高次元の小サンプルデータでも安定するよう改良する。
