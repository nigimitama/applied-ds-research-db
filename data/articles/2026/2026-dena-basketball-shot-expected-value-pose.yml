summary_ja: プロバスケットボールチームの試合映像から選手の3次元姿勢を復元し、関節間距離や体の向きといった特徴量をショット期待値モデルに追加した。単眼映像では奥行きと身長を分離できない問題に対し、選手ごとの倍率を補正する手法を採っている。
problem: 既存のショット期待値モデルが選手の姿勢(守備者の手の上げ下げなど)を考慮できず、直感に反する予測になっていた
result: 姿勢特徴量の追加により、守備者の手が下がっている場面の予測が38.7%から41.6%に上がり、手を上げられている場面は36.4%から32.2%に下がったと報告
