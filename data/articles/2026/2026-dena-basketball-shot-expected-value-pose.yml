evidence: blog
lang: ja
summary_ja: プロバスケットボールチームの試合映像から選手の3次元姿勢を復元し、関節間距離や体の向きといった特徴量をショット期待値モデルに追加した。単眼映像では奥行きと身長を分離できない問題に対し、選手ごとの倍率を補正する手法を採っている。
problem: "DeNAはBリーグの川崎ブレイブサンダースの運営に関わり、試合映像から選手位置のトラッキングデータを自動作成して分析している。その一つが、ショットの成功確率(に得点を掛けた期待値)を推定するショット期待値モデルである。このモデルは選手の位置情報などを入力とするが、選手の姿勢は入力に含まれない。そのため、似た位置・状況でもディフェンダーが手を上げているショットと下げているショットで予測確率がほぼ変わらず、直感に反していた。姿勢を加えるには、アリーナ1台のカメラ映像(単眼)から3次元の姿勢を復元する必要がある。単眼映像ではカメラに近い小柄な人と遠い大柄な人が同じ見え方になり、奥行きと身長を分離できない。トラッキングデータで位置を補正しても誤差が残り、選手が床から浮いて見える問題があった。"
approach: "映像のコート線を検出して3次元のコートと重ね合わせ、カメラの位置と向きを推定した。選手ごとにSAM 3D Bodyで全身の3次元メッシュを推定し、奥行きの曖昧さは選手ごとの倍率として扱った。ショットフレーム前後18フレームで倍率を同時最適化している。誤差は身長の一貫性・接地・空中での放物線軌道・水平方向の滑らかさの4項の和で、足元位置が倍率の1次式になるため線形最小二乗法で一度に解ける。踏み切りと着地のフレームは候補の全組を試して誤差最小のものを選ぶ。得られた3次元姿勢から、肩の高さ、体幹の傾き、ディフェンダーの手の高さ、視界を遮る体までの距離など7つの特徴量を作り、既存のLightGBMモデルに追加して再学習した。"
result: 姿勢特徴量の追加により、守備者の手が下がっている場面の予測が38.7%から41.6%に上がり、手を上げられている場面は36.4%から32.2%に下がったと報告
