title: 'OneTrans-GSR: A Generative Slate Ranking Paradigm Unifying Reranking and Mix-Ranking with One
  Autoregressive Transformer'
title_ja: 'OneTrans-GSR: 再ランキングとミックスランキングを単一の自己回帰Transformerで統合する生成的スレートランキング'
published: '2026-11-03'
collected: '2026-11-09'
