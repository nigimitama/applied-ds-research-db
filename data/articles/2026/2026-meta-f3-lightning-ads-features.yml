summary_ja: 広告ランキングモデル向け特徴量基盤F3の上に、特徴量ごとに独立してコンパイル・検証・デプロイ・ロールバックできる層を構築した。共有計算を保つため、計算識別子の安定化や実行計画・メモリバッファの共有などの最適化を行っている。
problem: "F3はMetaの広告ランキングモデル向け特徴量基盤で、1リクエストで2万以上の特徴量を計算する。全特徴量を単一のマージ済みグラフにコンパイルし、複数の特徴量で共通する計算(例: 7日間のフィルタ)を1つのノードにまとめて実行コストを下げていた。しかし、そのグラフがリリース単位でもあったため、1つの特徴量定義に誤りがあると、無関係な他の特徴量も含めてリリース全体が止まった。数百の特徴量なら問題は少なかったが、2万超になると失敗が頻発した。また、既存モデルが使う特徴量にはモデル関連の高コストなテストが必要で、後段のリリース工程でしか実行できず、その間は全特徴量が待たされた。リリースごとに特徴量を分けると共有計算が失われ、初期の試作ではCPU使用量が増えた。"
approach: "F3 Lightningは、リリース境界と実行境界を分離する。コンパイル時に特徴量ごとに独立した設定を作り、検証・配備・ロールバックを特徴量単位で行う。変更は影響とリスクで優先度付けしたキューから選ぶ。共有計算を取り戻すため、サービス起動時に4つの最適化を行う。(1) 計算識別子を、操作・パラメータ・入力の識別子から導出して安定させ、独立にコンパイルされた設定でも同じ計算を認識できるようにする。(2) 全特徴量にまたがる単一の実行計画を作り、重複ノードを1つにして、トポロジカル順に並べた平坦なリストとして実行する。失敗した計算の下流だけを未準備として扱う。(3) リクエストごとに1つの共有メモリバッファを使い、キャッシュミスを減らす。(4) 密なインデックスマッピングで配列に直接アクセスする。"
result: 同等の抽出特徴量が従来のF3より約3.6倍速く本番に到達し、インフラの計算コストは増えなかったと報告
