summary_ja: 設備の保全・点検業務を支援するため、複雑な技術図面とテキスト情報を論理的に結びつける知識構造化・検索の手法を提案した。4段階の知識グラフ構築と、効率的な検索手法(Multi G-Retriever)からなる。
problem: 設備保全の支援には、技術図面とテキストなど複数のデータを関連づけて検索できる必要がある。
approach: オントロジー拡張、知識グラフ生成、オントロジーマッピング、知識グラフ統合の4段階で構築し、Multi G-Retrieverで検索する。
