summary_ja: 陸上養殖ヒラメの体長を、水槽上部の単眼カメラ画像から自動計測する手法を提案した。頭や尾などの部位に分けるパートアウェアなパノプティックセグメンテーションで体長を推定する。
problem: 体長計測は手作業だと手間がかかりヒラメに生理的ストレスを与える。ヒラメは水槽底面にいるため、画像上の画素長を実寸に換算できる。
approach: 部位を識別するセグメンテーションで頭・尾などに分割し、画像上の長さから実寸の体長を推定する。
