summary_ja: 双方向推薦で、現時点のマッチング確率だけを重視して未知の有望な求人の探索を妨げ、ユーザーの離脱を招く問題に対し、現在のマッチング確率と将来の増分期待値の重み付き和を代理目的関数として長期のマッチングを最大化する設計を示した。
problem: 目先のマッチング確率の最大化は探索を妨げ、ユーザーの離脱や早期の利用停止につながる。
approach: 現在のマッチング確率と将来の増分期待値の重み付き和を代理目的関数とし、疎なデータでも将来増分を安定して推定できる定式化を用いる。
