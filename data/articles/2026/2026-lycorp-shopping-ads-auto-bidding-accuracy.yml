summary_ja: 就業型インターンで、検索連動型ショッピング広告の自動入札を構成する内部処理の誤差を調べ、誤差が生じる理由の仮説に基づく改善案を設計・実装した。変更前の方式と過去データで同条件比較し、誤差が大きいケースも個別に確認して合意形成した。
problem: "検索連動型ショッピング広告では、広告主の予算や目標を踏まえて入札価格を決める必要があり、過去の実績や予測値をもとに入札価格を自動調整する自動入札が使われている。自動入札は複数の内部処理から成り、前段の処理で出した情報が後段の判断に使われる。対象の処理は、限られた情報量の中から後段に必要な情報を残す役割を持つが、変更前の方式では特定の条件で誤差が生じやすく、とくに誤差が大きくなるケースがあった。誤差が大きいと後段の入札判断の精度が下がり、広告主の予算消化や広告配信に影響しうる。記事は就業型インターン(6週間)の報告で、既存の処理とデータを調べて課題を特定するところから始めている。"
approach: "既存コードや設計資料を読んで処理の役割を把握し、実データを分析して、変更前の方式で誤差が生じやすい条件と誤差が大きくなるケースを調べた。誤差が生じる理由について仮説を立て、その仮説に沿った改善案を提案している。改善案は複数を比較し、改善するケースと悪化し得るケースの両方を発生頻度と変化量で確認した。過去データで変更前の方式と同じ条件で比較して効果を確認し、設計書のレビューと関係者との合意を経て実装した。実装後は検証環境で動作を確認し、入札額が上がるケースと下がるケースを個別に調べて変化の理由を検証した。なお、具体的なアルゴリズムや技術の詳細は記事では公開されていない。"
result: "過去データでの評価で、平均相対誤差を約10分の1(例: 4.67%→0.44%)、p99相対誤差を約7分の1(例: 35.01%→5.37%)に低減したと報告。オンライン実験の記述はない"
