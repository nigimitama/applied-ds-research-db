summary_ja: セマンティックIDを生成する推薦で、ロングテール商品が取れにくい問題をSID構築・復号・照合の全体で分析した。並列SIDと、人気度の偏りを補正するビームサーチ、部分一致での回収を組み合わせたReSIDを提案。AlibabaのDigital Commerce Groupの本番システムで主要トラフィックを処理していると報告している。
problem: 生成型推薦は偏った行動分布と厳しい配信予算のもとでロングテール商品を取り出しにくい。ビームサーチが完全一致に至る前の候補を切り捨てるため、復号列に残る局所的な手がかりも回収できない。
approach: 長い並列SIDを用い、人気度で偏りを補正しユーザー意味を考慮したビームサーチで有望な経路を残し、残ったトークンからの部分一致でアイテムを回収する。
result: ロングテールの検索で最高水準を達成しつつ全体精度も同等で、狭いビーム幅で低遅延・高スループット。本番で主要トラフィックに配信され事業上の効果があると報告(数値は原文参照)。
