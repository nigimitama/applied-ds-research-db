summary_ja: 渋滞時は下流を通過できる台数が制限されて、観測交通量が本来の交通需要より小さくなる。過去の自由流交通量の学習に基づいて、渋滞時の交通需要を推定する手法を提案した。
problem: 渋滞予測の精度には交通需要の把握が欠かせないが、渋滞時は車両検知器の交通量と需要が乖離する。
approach: プローブ車両の時空間速度データと過去の自由流の交通量の学習を使い、観測制約下の交通需要を推定する。
