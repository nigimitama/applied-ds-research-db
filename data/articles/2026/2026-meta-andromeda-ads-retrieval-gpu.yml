summary_ja: 広告推薦の第1段であるリトリーバルに、モデル・システム・GPUハードウェアを協調設計して、ランキング段に近い品質のモデルを適用した。本番で全適格広告をスコアリングし、同じレイテンシ予算で上位候補を絞り込む。
problem: ランキング段の高品質なモデルはリトリーバルの規模では計算コストが高すぎた
result: 毎秒10億件超の広告を処理(2024年版の100倍)、2025年以降Facebookでコンバージョンが2.4%増加したと報告
