summary_ja: 広告推薦の第1段であるリトリーバルに、モデル・システム・GPUハードウェアを協調設計して、ランキング段に近い品質のモデルを適用した。本番で全適格広告をスコアリングし、同じレイテンシ予算で上位候補を絞り込む。
problem: "Meta Andromedaは、広告推薦の第1段であるリトリーバルを担う。膨大な広告候補を数ミリ秒で少数に絞り込み、後段のランキングで詳細にスコアリングする構成になっている。ランキング段の深いモデルはリトリーバルの規模では計算コストが高すぎ、品質とコストの両立が難しかった。さらに、生成AIによる広告クリエイティブ作成で候補数が急増し、2024年版の1枚あたり毎秒数千万件の評価では足りず、毎秒数十億件の評価が必要になった。この規模ではGPUカーネル間の中間テンソルが毎秒テラバイト級のメモリ帯域を消費し、CPUホストとGPU間で広告を受け渡すネットワークも飽和する。モデル品質、システム構成、ハードウェア利用率を同時に改善する必要があった。"
approach: "モデルでは、LLMに着想を得たMixture-of-Expertsをリトリーバルに導入した。ユーザー側は専門化した複数のユーザータワーを expertとし、広告側はリアルタイムの配信コンテキストを取り込んで符号化する。interaction層は、候補ごとに関連性の高いexpertへ動的にルーティングするMoEアテンション型のゲーティングネットワークに置き換えた。これにより2024年版比で推論FLOPsを約300分の1にした。システムでは、埋め込み取得・ユーザーと広告の相互作用・スコアリングを1つのGPUカーネルに融合し、中間結果をレジスタと共有メモリに留めてHBMへの書き出しを避けた。さらにインデックスマッチング、スコアリング、top-K選択を同一GPUサーバーに集約してネットワーク量を約100分の1にした。NVIDIAと共同でカーネルを最適化している。"
result: 毎秒10億件超の広告を処理(2024年版の100倍)、2025年以降Facebookでコンバージョンが2.4%増加したと報告
