summary_ja: B2Bのお問い合わせフォームは入力項目が少なく、特徴量やサンプルが乏しい。Claude 3 Haikuで自由記述から動機と能力のスコアを抽出し、AIエージェントのWeb検索で企業属性を自律収集して、成約確率を予測する手法を提案した。
problem: B2Bのフォームは離脱を防ぐため情報が少なく、従来の機械学習では特徴量・サンプル不足で難しい。
approach: 自由記述から動機・能力のスコアをLLMで抽出し、AIエージェントのWeb検索で企業属性を集めて成約確率を予測する。
