summary_ja: 通信キャリアの検索ログと性別・年齢データから、飲食チェーンの興味層を、共起する検索語の正規化PMI(NPMI)で時系列に分析した。月次のNPMIの推移から興味の層が移る様子を可視化できた。
problem: ブランドの具体的な客層データはほとんど公開されないが、検索ログは自発的な関心を反映する。
approach: 共起するクエリのNPMIを属性セグメントごとに計算し、月次の推移を可視化する。
