summary_ja: メモリバンク型の異音検知で、運用中に得られる少数の異音サンプルを、再学習なしに活用するスコア補正手法を提案した。
problem: メモリバンク型は性能と計算コストに優れるが、正常データの分布だけをモデル化し、運用中に得られる少数の異音データを使う仕組みがない。少数ショットの先行手法は再学習が必要で、損失設計も複雑。
approach: 少数の異音サンプルを使って、再学習せずに異常スコアを補正する。
