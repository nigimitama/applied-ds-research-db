title: 'SPADE: Spatiotemporal Preference Alignment and Diversity Enhancement for Local Search'
title_ja: 'SPADE: ローカル検索のための時空間的嗜好アラインメントと多様性強化'
published: '2026-11-03'
collected: '2026-11-09'
companies:
- meituan
