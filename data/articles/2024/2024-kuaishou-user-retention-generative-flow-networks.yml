summary_ja: 継続利用(リテンション)をセッション終了時の満足度の総合的な推定とみなし、確率的フローで扱うGFN4Retentionを提案した。各推薦ステップを次状態への前向きフローとし、リテンション報酬を後ろ向きフローで各ステップへ伝播する。公開データでのオフライン実験と産業プラットフォームでのオンラインA/Bテストで評価。
problem: リテンションの最適化は、離脱と復帰を伴う挙動、報酬の疎さと遅延、即時フィードバックとの関係の不確かさのために難しい。
approach: Generative Flow Networksを使い、推薦系列を前向きフローで、リテンション報酬の逆伝播を後ろ向きフローで表現してステップごとに割り当てる。
