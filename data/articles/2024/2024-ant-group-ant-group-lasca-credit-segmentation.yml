summary_ja: 信用スコアに基づくリスクレベルのビン分割で、安定性の高い解を探す二段階手法LASCAを提案。進化的アルゴリズムで良質なビン分割解を集め、代理モデルで最も安定な解を探索する。Alipayの与信リスク評価システムに導入。
problem: リスク評価の顧客セグメンテーションでは、ブラックボックス性と膨大なユーザデータによる計算負荷のため、安定性の評価が難しい。
approach: 高品質データセット構築(進化的アルゴリズムでビン分割解を収集)と、信頼できる代理モデルを構築して最安定解を探索するデータ駆動最適化の2段階。
