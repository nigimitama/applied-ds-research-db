title: 'LASCA: A Large-Scale Stable Customer Segmentation Approach to Credit Risk Assessment'
title_ja: 'LASCA: 与信リスク評価のための大規模で安定した顧客セグメンテーション'
published: '2024-08-25'
collected: '2026-11-10'
companies:
- ant-group
collab_academia: true
