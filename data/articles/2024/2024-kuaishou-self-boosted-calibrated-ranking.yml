lang: en
summary_ja: 点別損失とペア損失を併用する従来のキャリブレーション付きランキングの弱点を解消するSBCRを提案。稼働中モデルのスコアを文脈特徴として使うペア損失でランキングを学習し、キャリブレーションは別モジュールで分離する。動画検索のA/Bテストで評価している。
problem: ランキング損失の計算に候補リスト全体を同一ミニバッチに入れる必要がありデータのシャッフルを妨げる。また、衝突する2つの損失を1つの予測に課すためトレードオフが最適にならない。
approach: 稼働中モデルのスコアを保存して文脈特徴とし、それに基づく自己ブーストのペア損失と点別損失でランキングモジュールを学習する。キャリブレーションは独立のモジュールで学習し目的を分離する。
