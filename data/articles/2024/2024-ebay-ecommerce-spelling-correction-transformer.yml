summary_ja: EC検索のスペル訂正で、既存のLSTM系判別モデルの代わりにBARTやT5を微調整して生成的に誤り訂正する。プルーニングと教師なし蒸留で遅延を抑え、米英トラフィックのA/Bテストで検証した。
problem: 検索クエリの綴り誤りは検索結果の質を下げる。判別モデル中心の既存方式の精度を高めつつ、リアルタイム検索の厳しい遅延制約を満たす必要がある。
approach: 事前学習済みのBART/T5を微調整して誤り訂正を生成タスクとして解き、プルーニングとno-teacher蒸留で推論を軽量化する。英語のほか欧州4言語向けの多言語モデルも微調整した。
