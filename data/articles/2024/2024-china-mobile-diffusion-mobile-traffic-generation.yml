  type: conference
  venue: KDD Applied Data Science Track
evidence: peer_reviewed
lang: en
summary_ja: 通信事業者の実測トラヒックが入手しにくい問題に対し、衛星画像・POI・人口といった公開データのみを条件として基地局トラヒックを生成する拡散モデルOpenDiffを提案した。生成データはChina
  Mobileのネットワーク最適化プラットフォームで試験されている。
problem: モバイルネットワークの計画・最適化には都市単位のトラヒックデータが必要だが、事業者の実測データは取得が難しく、既存の生成手法も事業者データへの依存が大きい。
approach: 衛星リモートセンシング画像、POI、人口の公開データから、多正例コントラスト学習で条件情報を構築し、注意機構ベースの融合で人の活動特徴とトラヒックパターンを結び付けて、条件付き拡散モデルでトラヒックを生成する。
result: 3都市で、生成の忠実度と制御性が既存手法より14.36%と13.05%向上したと報告。生成データをChina Mobileの最適化プラットフォームで試験した。
