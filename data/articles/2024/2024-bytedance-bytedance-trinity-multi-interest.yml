summary_ja: 複数関心・ロングテール・長期関心を別々に扱う従来研究を統合し、長期行動のヒストグラムから関心を把握して未提供のニッチな関心を検出するTrinityを提案。Douyinの推薦に展開された。
problem: 関心の三側面が個別に研究され相互関係が無視され、最近見ていない関心が出なくなる「関心健忘」が起こる。
approach: 長期行動を関心のヒストグラムに変換し、複数関心用Trinity-M、ロングテール用Trinity-LT、長期用Trinity-Lの三つのリトリーバーで構成する。計算負荷が小さい。
