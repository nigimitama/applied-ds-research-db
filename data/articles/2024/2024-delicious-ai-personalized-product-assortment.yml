summary_ja: 実店舗の棚に並べる商品の組み合わせを、3Dセンサーで得た販売状況から店舗ごとに推薦するエッジ型システムEdgeRec3Dを提案した。ノイズのあるLIDAR推定をベイズ的な収益モデルで扱い、実店舗のA/Bテストで有効性を確認している。
problem: 実店舗の商品アソートメントは組合せ探索が大きく、消費者嗜好も店舗ごとに異なる。従来は細かい販売推定が難しく、パーソナライズが困難だった。
approach: 3Dコンピュータビジョンで販売を自動的に細粒度で推定し、ネットワークエッジ上で動かす。ノイズを含む3D LIDAR推定にはベイズ収益モデルを使い、空間クラスタリングで嗜好の不均一性に対応し、グラフベースの候補生成で組合せ探索を扱う。
