- jd
collab_academia: true
source:
  type: conference
  venue: KDD Applied Data Science Track
evidence: peer_reviewed
lang: en
summary_ja: 10億規模の商用異種グラフで、全ペアを調べずに有望な候補ペアを絞り、ペア間のメタパス上の内容情報から関係の有無を予測するPaths2Pairを提案。JD Logisticsで新規法人顧客の獲得に活用された。
problem: 大規模グラフでは全エンティティペアの検査が非現実的で、ノード単位の集約では2ノード間の直接的な接続情報が失われる。
approach: まず有望なペアを選別し、各ペア間のメタパスが持つ多様な内容情報を用いて目的の関係が存在するかを予測する。
