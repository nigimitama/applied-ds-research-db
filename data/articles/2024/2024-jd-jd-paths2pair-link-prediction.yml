title: 'Paths2Pair: Meta-path Based Link Prediction in Billion-Scale Commercial Heterogeneous Graphs'
title_ja: 'Paths2Pair: 10億規模の商用異種グラフにおけるメタパスに基づくリンク予測'
published: '2024-08-25'
collected: '2026-11-10'
