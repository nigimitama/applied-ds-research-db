summary_ja: 連続でロングテールな収益反応に対するアップリフトモデリングで、ZILN損失による回帰と、ランキング誤差の上界を使った追加損失・リストワイズ損失を組み合わせる枠組みを提案。Tencentのフィンテックマーケティングで大規模オンライン実験を行った。
problem: 収益アップリフトは連続・ロングテール分布で予測が不正確になりやすく、既存手法は個人間のランキング精度を軽視していた。
approach: ZILN損失を用いた回帰ネットワークを既存アップリフトモデルに適用可能にし、ランキング誤差の理論解析から導いた2つの上界を損失項に加え、全体母集団のリストワイズ・アップリフトランキング損失で補強する。
