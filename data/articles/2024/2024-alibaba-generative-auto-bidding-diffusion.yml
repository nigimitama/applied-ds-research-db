summary_ja: オートビディングを強化学習ではなく生成モデルの問題として捉え直し、条件付き拡散モデルDiffBidで入札軌道を生成するAIGBを提案した。実データでの評価とAlibaba広告プラットフォームでのオンラインA/Bテストで有効性を確認している。
problem: 既存のオートビディングは強化学習が主流だが、長い時間ステップでの誤差の蓄積や学習の不安定さが課題になる。
approach: リターンと入札軌道全体の関係を直接モデル化する条件付き拡散モデルDiffBidで、目標リターンに合う入札系列を生成する。
result: Alibaba広告プラットフォームのオンラインA/BテストでGMV +2.81%、ROI +3.36%と報告。
