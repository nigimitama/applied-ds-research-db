summary_ja: クラウド事業者の営業が狙うべき企業を、ソリューションと企業の多フィールド特徴のマッチングとして扱うCAMAを提案。フィールド埋め込みを加えたBERTと、データ拡張を用いた対照事前学習で疎な取引データを補う。Huawei
  Cloudに導入しCVRの向上を報告している。
problem: B2Bのクラウドソリューションと顧客企業の対応付けでは、複雑な多フィールド特徴のモデリングと、取引データが少なく疎であることが難しい。
approach: 階層的なマルチフィールドマッチング構造にフィールド認識埋め込みを加えたBERTエンコーダを用い、トークンマスク・フィールドマスク・企業置換の3種のデータ拡張で対照学習による事前学習を行う。
