id: 2024-huawei-b2b-cloud-solution-matching
url: https://doi.org/10.1145/3637528.3671513
title: Enhancing Multi-field B2B Cloud Solution Matching via Contrastive Pre-training
title_ja: 対照事前学習によるマルチフィールドB2Bクラウドソリューションのマッチング強化
published: '2024-08-25'
collected: '2026-11-10'
