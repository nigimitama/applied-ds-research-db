summary_ja: 個人レベルのGPS位置データで製造業の主要工場の滞在人口を測り、リース契約データと合わせて取引先企業のリース需要を予測する機械学習モデルを作った。COVID-19で企業活動が大きく乱れた時期を除き、GPSの活用で予測が改善したと報告している。
problem: リース需要を先読みしたいが、取引先の活動状況を示す指標が乏しい。
approach: GPSから工場の滞在人口の変化を測り、リース契約データと組み合わせて取引先企業のリース需要を予測するモデルを構築した。
