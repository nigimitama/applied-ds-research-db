summary_ja: ECサイト上で物流会社が配送サービスを広告する「物流広告」のCVR予測フレームワークMCACを提案。過去の発送履歴からオフラインの物流嗜好を抽出し、複数ステップのコンバージョンをマルチタスク条件付きアテンションで予測する。
problem: 物流広告はオンライン購買だけでなくオフラインの物流嗜好も要因となり、コンバージョンの工程が長いためデータが疎で、各工程間の関係も考慮する必要がある。
approach: 発送履歴からユーザーの物流嗜好を抽出するモデルと、複数ステップ間の依存を条件付きアテンションで表現するマルチタスクのCVR予測モジュールを組み合わせる。中国最大級のECプラットフォームで評価・導入した。
