summary_ja: リコール・プレランキング・ランキングの多段推薦で、露出バイアスとランキング段との不整合を扱うため、サンプル選択・ドメイン適応・不偏蒸留の3モジュールからなる枠組みを提案。実際の産業システムに導入されている。
problem: プレランキングは露出済みアイテムのフィードバックで学習する一方、評価はリコール全体が対象となり選択バイアスが生じる。全件を負例扱いで学習する方法はコストが高くノイズも大きい。
approach: サンプル選択でバイアスとコストを下げ、ドメイン適応で未露出サンプルに疑似ラベルを付与し、露出非依存のスコアを使う不偏蒸留で不偏なモデルを学習する。新しい評価指標も導入。
