summary_ja: 小売店舗のフードロス削減と収益向上のため、需要予測に基づく離散時間の陳列数最適化アルゴリズムを開発した。過去の販売データから需要傾向を学習し、仕入過多によるロスと販売機会損失を最小化する陳列数を単位時間ごとに1つの値として出力する。
problem: 小売店では大量のフードロスが生じ、環境負荷や経済的損失が問題。過剰な仕入と販売機会の損失の両方を抑える陳列数が必要。
approach: 過去の販売実績から需要の傾向を学習し、需要予測に基づいて陳列数を最適化する。
