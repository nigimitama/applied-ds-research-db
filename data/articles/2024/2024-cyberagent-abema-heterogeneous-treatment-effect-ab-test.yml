summary_ja: 動画配信サービスABEMAのA/Bテストデータで、平均処置効果だけでなく機械学習による異質処置効果(HTE)を推定した。実験前に視聴していたコンテンツの傾向によって処置効果が異なることを確認した。
problem: ABEMAは日々A/Bテストで改善を検証しているが、平均処置効果だけではユーザー間の効果のばらつきが分からない。
approach: A/Bテストのデータに機械学習ベースの異質処置効果推定を適用し、実験前の視聴傾向別の効果を分析する。
