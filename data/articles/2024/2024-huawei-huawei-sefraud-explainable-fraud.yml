summary_ja: 不正検知と説明生成を一つのモデルに統合するSEFraudを提案。異種グラフTransformer上で特徴マスクとエッジマスクを学習し、教師ありコントラスト三つ組損失でマスクの品質を高める。中国工商銀行(ICBC)に導入された。
problem: 事後的な説明手法はインスタンスごとの再学習が必要で、不正検知の精度と解釈性を同時に満たすのが難しい。
approach: 異種グラフTransformerネットワークに学習可能な特徴マスク・エッジマスクを組み込み、マスク自体を説明として出力する。教師ありコントラスト三つ組損失でマスクが重要な特徴・辺を反映するようにする。
