title: An Offline Meta Black-box Optimization Framework for Adaptive Design of Urban Traffic Light Management
  Systems
title_ja: 都市の信号制御システム適応設計のためのオフラインメタブラックボックス最適化
published: '2024-08-25'
collected: '2026-11-10'
