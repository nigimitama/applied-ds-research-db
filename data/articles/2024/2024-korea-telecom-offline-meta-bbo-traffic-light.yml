lang: en
summary_ja: 信号の現示組合せと現示時間配分の設計を、オフラインのメタブラックボックス最適化として定式化した。Attentive Neural Processで渋滞度を不確実性付きで予測し、ベイズ最適化で未知の交通パターンに対する設計を少数のシミュレーションで求める。実交通システムへの導入で処理台数が4.80%増加したと報告。
problem: 複雑な都市道路網では信号が手動設定されがちで、変化する交通パターンへの適応が弱く渋滞が深刻になる。
approach: 交通パターンごとの設計選択と渋滞指標を対にしたオフラインデータを作り、Attentive Neural Processを代理モデルにしてベイズ最適化で未見パターンの設計を探索する。
