title: 'DuMapNet: An End-to-End Vectorization System for City-Scale Lane-Level Map Generation'
title_ja: 'DuMapNet: 都市規模の車線レベル地図生成のためのエンドツーエンドなベクトル化システム'
published: '2024-08-25'
collected: '2026-11-10'
