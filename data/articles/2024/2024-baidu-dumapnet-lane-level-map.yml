summary_ja: 車線レベル地図を、標準化されたベクトル要素とトポロジーとして一括生成するDuMapNetを開発した。2023年6月からBaidu Mapsで運用されており、360を超える都市をカバーしコストを95%削減したと報告している。
problem: 都市規模の高精度な車線地図の作成は人手の比重が大きく高コストで、路面の摩耗や遮蔽、全体の整合性の確保が難しい。
approach: Transformerベースの車線グループ単位予測モジュールと、近傍の予測結果を参照するコンテキストプロンプトエンコーダを組み合わせ、画像からベクトル要素とトポロジーをエンドツーエンドで出力する。
