summary_ja: 検索クエリを教師として推薦におけるユーザの需要意図を学習し、固有意図・需要意図・対話アイテムの関係を共有空間の埋め込み変換で表すUDITSRを提案。Meituan Waimaiに導入し、GMVとCTRの向上を報告している。
problem: 検索と推薦を別々に扱うとユーザの時々の需要意図を推薦に活かせず、両タスクのデータも連携できない。
approach: 検索クエリを需要意図生成器の教師信号とし、ユーザの固有意図と需要意図からアイテムへの関係を埋め込み変換でモデル化、意図変換の対照学習で制約を加える。
