summary_ja: 電子基板などの外観検査の異常検知で、学習データにノイズが混じる実運用の状況に対応するため、既存手法SoftPatchの使い勝手を改善したサンプル選別手法を提案した。
problem: 異常検知の機械学習手法は、きれいな学習データを前提に評価されているが、実運用ではノイズを含むデータで精度が下がる。
approach: 画像パッチ単位で選別するSoftPatchを改良し、ノイズを含む学習データから使うサンプルを選別する。
