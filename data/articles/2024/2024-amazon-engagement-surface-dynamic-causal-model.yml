summary_ja: Amazonの顧客行動データ(数十億件規模)を使い、あるエンゲージメントサーフェスが生む価値を切り分けて測る大規模な動的因果モデルを構築した。過去期間の処置効果が後続期間へ波及する構造と同期間の効果を取り込み、投資対効果の推定や価値の高い商品群の特定に使う。
problem: 大企業では施策の長期的な因果効果を正確に測らないと投資対効果を誤って計算してしまう。エンゲージメントサーフェスの価値は、他の経路で得られる成果と切り分けにくい。
approach: 顧客行動の大規模データで学習する動的因果モデル。以前の期間の処置効果が後の期間へ連鎖的に波及する構造と、同一期間内の同時的な顧客行動の影響を同時に表現する。
