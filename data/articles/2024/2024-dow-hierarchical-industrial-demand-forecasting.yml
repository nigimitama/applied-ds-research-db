summary_ja: 階層的な需要時系列で下位ほどスパースになる問題に対し、スパースと密な系列に異なる分布を仮定して階層整合を取る確率的予測モデルHAILSを提案。1万超の製品を持つ化学メーカーに導入した。
problem: 大企業の需要予測では階層下位の系列がスパースで、既存の階層予測手法はこの階層ごとの違いを無視し、巨大な階層にスケールしにくい。
approach: スパース系列と密系列を別の分布でモデル化し、階層制約を満たすよう整合(reconcile)させる確率的階層予測モデル。
