summary_ja: セントラルヒーティングの運用判断に使う室内温度予測について、物理法則と整合する解釈性を重視したモデルCONSTを提案した。JDのSmartHeatシステムのデータで、北部中国の13の熱供給ステーションの時間別室内温度を予測する。
problem: 暖房の制御には室内温度の予測が重要だが、深層学習モデルは解釈性が低く物理法則との整合が保証されないため、実運用での利用が難しい。要因間の多重共線性も精度と解釈性を損なう。
approach: 多重共線性に対処する差分予測モジュールと、マルチタスク学習で拠点間の共通パターンを捉える時空間一貫性モジュールを組み合わせる。部分依存プロットに基づく既存の解釈性指標の欠点を補う新たな指標群も提案している。
