summary_ja: 予測・最適化・適応的ヒューリスティクスの3モジュールからなる汎用マーケティング最適化フレームワークNOAHを提案。LinkedInのメールマーケティングに適用し、従来のランキングを上回る成果を得た。
problem: マーケティングでは、BtoB/BtoC、自社チャネル/有料チャネルといった多様な文脈で施策を選ぶ必要があるが、これらを一貫して扱える汎用的な最適化の枠組みが不足していた。
approach: 施策候補ごとの事業指標を予測するモジュールと、制約下で施策を選ぶ最適化モジュール、両者のフィードバックを補完する適応的ヒューリスティクスを組み合わせる。メール配信では候補取得とメール最適化の2段構成とする。
