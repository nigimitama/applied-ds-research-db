summary_ja: 養殖ブリの体重を水中カメラ計測から推定する精度を上げるため、複数の養殖場で蓄積した実測の体形・体重データを使って特徴量エンジニアリングの重要性を検討した。
problem: 魚を取り上げて秤量する従来法は時間がかかり魚へのストレスや死亡率の上昇を招く。水中カメラによる推定法は登場したが精度に改善の余地がある。
approach: 複数の養殖場でブリの体形と体重の実測データを蓄積し、特徴量を工夫して体重推定モデルの精度を比較した。
