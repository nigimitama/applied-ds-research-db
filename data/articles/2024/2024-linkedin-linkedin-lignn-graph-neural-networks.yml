summary_ja: LinkedInで大規模GNNを開発・本番導入した知見をまとめた論文。適応的近傍サンプリングや学習バッチの工夫などで学習を高速化し、求人・広告・フィード等の推薦で本番指標を改善した。
problem: LinkedInの巨大なグラフで、GNNを学習効率と本番指標の改善の両面から実運用に載せる必要があった。
approach: 適応的な近傍サンプリング、学習データのバッチ化・スライス、専用の共有メモリキュー、ローカル勾配最適化などで大規模GNN学習を高速化し、複数のプロダクトに展開した。
