summary_ja: 購入サンプルが疎な広告LTV予測で、外部データも取り込んで学習データを増やす適応差分シャムネットワークADSNetを提案した。情報利得でサンプルを選別して負の転移を避け、ドメイン適応で分布差を縮める。オンラインA/Bテストで効果を確認している。
problem: 広告の実データではLTV(購入)のラベルが疎で予測が難しい。外部データを足すと分布のずれや雑音サンプルによる負の転移が起きうる。
approach: 情報利得を計算する利得評価戦略で、ターゲットドメインに有用なサンプルを学習し雑音サンプルを除外する。さらにドメイン適応モジュールでドメイン間の分布距離を縮める。
result: オフラインでGINI +2%、ロングテールの予測が改善。オンラインA/BテストでLTV +3.47%、GMV +3.89%と報告。
