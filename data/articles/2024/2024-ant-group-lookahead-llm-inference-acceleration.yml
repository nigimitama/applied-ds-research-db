summary_ja: トライ木ベースの検索で複数の候補トークン列を一度に生成し、検証して最長の正しい部分列を採用することで、通常のデコードと同一の出力を保ったままLLM推論を高速化するLookaheadを提案。Alipayで運用されている。
problem: LLMの自己回帰デコードは遅く、近似を入れる高速化手法は生成精度を損ねる。サービス運用では精度を落とさずにレイテンシとスループットを改善する必要がある。
approach: 過去の生成文脈などから候補トークン列をトライ木で取得し、1回の順伝播でまとめて検証して正しい最長部分列を受理する。出力は標準のデコードと一致し、最悪時も標準デコードと同等で、複数のLLMへ最小限の改修で適用できる。
