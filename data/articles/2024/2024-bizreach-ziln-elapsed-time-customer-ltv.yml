summary_ja: 売上が発生しない顧客が多い状況で使われるZILNモデルの、観測期間が固定という制約を取り除き、経過時間を考慮した顧客生涯価値(LTV)予測を提案した。
problem: ZILNは学習データの観測期間が固定で、予測時に期間を変えられない。そのため十分な学習データを集めにくい。
approach: 経過時間を入力に取り込んだZILNモデルで、観測期間の異なるデータでも学習・予測できるようにする。
