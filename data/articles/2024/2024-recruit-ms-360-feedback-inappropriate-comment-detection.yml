summary_ja: 360度評価の自由記述コメントから不適切・攻撃的な内容を自動判定するモデルを作った。実アノテーションデータで微調整したBERTは再現率80%を達成し、テキスト生成モデルによる学習データ拡張の効果も検証している。
problem: 360度評価のコメントには、スキル開発を妨げる不適切な内容が含まれることがあり、人事担当者が手作業で確認する負担が大きい。
approach: 実際のアノテーションデータでBERTを微調整して不適切コメントを判定し、テキスト生成モデルでデータを拡張した効果を検証した。
