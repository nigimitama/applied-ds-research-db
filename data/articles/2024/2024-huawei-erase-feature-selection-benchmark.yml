summary_ja: 深層推薦モデルの特徴選択手法11種を統一条件で比較するベンチマークERASEを構築した。公開データ4種に加え、非公開の産業データと実商用プラットフォームでも評価し、特徴数に対する頑健性を測るAUKC指標を導入している。
problem: 特徴選択の研究は実験設定がまちまちで公平な比較が難しく、大規模データや複数のバックボーンでの検証が少ない。また最良値のみの報告が多く、調整コストや頑健性が見えにくい。
approach: 従来手法と深層学習ベースの手法を含む11の特徴選択法を、共通の実験設定で複数のバックボーン・データに対して比較する。特徴数を変えたときの安定性を評価する指標AUKCを提案し、コードも公開している。
