summary_ja: 自動車組立ラインで、設備依存や作業順序などの制約下で150作業を20人に割り当てる大規模問題を、順序制約を扱えるよう定式化した量子アニーリングで解いた。
problem: 組立ラインの作業割当は設備依存・作業順序制約・移動の最小化・工程間の負荷平準化を同時に満たす必要があり、従来の数理手法では計算に時間がかかる。従来の量子アニーリングでは順序制約を定式化できなかった。
approach: 順序制約を含む作業割当を量子アニーリングで扱える形に定式化する手法を開発した。
