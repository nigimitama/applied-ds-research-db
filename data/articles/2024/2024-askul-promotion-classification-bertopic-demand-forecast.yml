summary_ja: テキストで管理されるプロモーション情報から、種別・期間・割引率・対象などを抽出して需要予測の特徴量にするため、トピックモデルBERTopicでプロモーションを分類した。過去のプロモーションデータで実験している。
problem: ECでは販促が需要に大きく影響するが、プロモーション情報はテキストで保存されており、特徴量化が難しい。
approach: 文脈に頑健なBERTopicで各プロモーションを分類し、分類されたトピックに基づいて需要予測用のプロモーション特徴量を作る。
