summary_ja: 交通流シミュレーション向けに、短い時間間隔の流入交通量を少ない計算量で予測する手法を提案した。学習・予測のデータを分割して計算量を抑え、予測値を用いたシミュレーションが実際の渋滞を再現できることを確認している。
problem: 従来の季節調整モデルは時間単位の予測が可能だが、細かい時間間隔の予測ではパラメータ調整の計算が重くなる。
approach: 交通量データを分割して学習・予測し、短い間隔でも計算量を抑えて予測する。
