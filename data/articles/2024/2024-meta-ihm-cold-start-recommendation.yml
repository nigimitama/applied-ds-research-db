summary_ja: 新着コンテンツを関連ユーザへ素早く届ける課題に対し、アイテム塔へユーザ交互作用情報を直接注入し、注意プーリングによる帰納的構造で再学習を不要にするItem History Model(IHM)を提案。公開データと産業データで評価している。
problem: 標準のTwo Towerモデルでは塔間の特徴相互作用が限られ、コールドスタートアイテムでは学習データの疎性で情報損失が悪化する。大量のユーザ生成コンテンツによりエンドツーエンドの遅延も大きなボトルネックとなる。
approach: アイテム塔にユーザ交互作用の履歴を注入して情報損失を補い、注意ベースのプーリングによる帰納的構造で再学習なしに新アイテムを扱えるようにする。
