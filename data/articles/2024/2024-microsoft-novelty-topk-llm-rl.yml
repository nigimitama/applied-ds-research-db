summary_ja: クリック履歴のない新規アイテムを推薦するため、LLMの関連性フィードバックを報酬とする強化学習でtop-kの新規性を最適化する手法を提案。大手検索エンジンのクエリ広告タスク等で評価している。
problem: 新規性はソートを含む非微分な指標で、新規アイテムにはクリックデータがなく教師あり学習が難しい。数百万の候補ではサンプル効率も問題になる。
approach: LLMを関連性の判定者として報酬を与える強化学習とし、リスト全体の報酬をクエリ-アイテム単位の報酬に分解して二値の判断問題に落とし込む。
