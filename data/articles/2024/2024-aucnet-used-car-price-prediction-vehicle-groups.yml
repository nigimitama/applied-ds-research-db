summary_ja: 中古車オークションの落札価格予測サービスで、予測精度が低かった特定車種に対し、データを3つの車種グループに分けてグループ別にモデルを作った。分割後のデータが十分大きい場合に、以前のモデルより精度が改善した。
problem: 全体では高精度でも、特定の車種では予測精度が低い問題があった。
approach: データを3つの車種グループに分割し、グループごとに個別の予測モデルを構築する。
