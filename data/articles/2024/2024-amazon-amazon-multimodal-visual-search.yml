summary_ja: 画像のみの照合が局所的な視覚パターンによる誤検出を起こす問題に対し、画像-テキスト整合損失を距離学習に加えた3塔・4塔モデルで、画像+テキストのマルチモーダル検索も実現した。
problem: 画像同士のマッチングは局所パターンに引きずられて誤検出が生じ、ブランドや色などの補足条件による検索結果の絞り込みもできなかった。
approach: 画像間損失に画像-テキスト整合損失を制約として加えた深層距離学習を行い、短いテキストクエリも入力する4塔モデルに拡張。画像・テキスト埋め込みの加重和で融合クエリを作る。
