summary_ja: マーケターが自然言語で述べる顧客ターゲティング要望を構造化クエリへ変換するため、類推推論プロンプトとGPT-3.5からの蒸留を組み合わせたARALLMを提案。非専門家でも対象ユーザーを選べるようにする。
problem: 非専門のマーケターは対象ユーザーの条件を自然言語で伝えるが、重要な項目が文中に明示されないことが多く、構造化には高い理解・推論力が要る。手書きの推論例を新規要望ごとに用意するのも現実的でない。
approach: 推論例のライブラリから類似例を検索して類推推論プロンプトを構成し、大規模モデルの出力を小型の生徒モデルへマルチタスクで蒸留して本番運用可能にする。
