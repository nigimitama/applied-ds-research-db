summary_ja: Airbnbの地図検索結果で、リスト向けと同じ予約確率順のランキングを使う前提が成り立たないことを実験で示し、表示ピン数を選ぶBookability Filterなど、地図に適した方針を提案。実運用で大きなユーザ体験改善を報告している。
problem: リスト表示と地図表示で同じ予約確率順ランキングを使ってきたが、地図ではユーザの注目の仕方が異なり、リスト向けの仮定が崩れる。
approach: 地図上のピンの並べ替えは予約にほとんど影響しないことを実験で確認し、「Less Is More」原則に基づいて表示するピン数を決めるBookability Filterを導入するなど、地図専用のランキング設計とした。
