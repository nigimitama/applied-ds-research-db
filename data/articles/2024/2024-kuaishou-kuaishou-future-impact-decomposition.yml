summary_ja: 推薦リスト単位(リクエスト単位)の強化学習で、ユーザの項目レベルの反応を捉えられない問題に対し、項目単位のアクター・クリティックと、報酬に基づく将来影響の分解、敵対学習による再重み付けを提案。
problem: リクエスト単位のMDPはリスト全体で状態を一度だけ更新するため、実際のユーザの項目単位の行動と合わず、各項目の長期的影響を推定できない。
approach: リクエストレベル定式化の下でも項目単位のアクター・クリティックを用い、報酬ベースの将来影響分解で各項目の長期影響を推定し、モデルベースの再重み付けに敵対学習を組み合わせる。
