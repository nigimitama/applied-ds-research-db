summary_ja: EC広告のCTR/CVR予測に対する事後キャリブレーションを、値の補正と形状の補正に分解し、基底関数のアンサンブルで表現力を高めるDESCを提案した。公開・産業データでの評価とShopeeのオンライン実験で効果を確認している。
problem: EC広告のCTR/CVR予測は検証データで学習するキャリブレータで補正するが、既存手法は値のキャリブレーションと形状のキャリブレーションを同時に満たせない。
approach: 多フィールドのキャリブレーションを値と形状に分解し、基底となるキャリブレーション関数を用意してアンサンブルで組み合わせることで、関数の表現力とデータ利用効率を高める。
result: オンライン実験でCVR +2.5%、GMV +4.0%と報告。
