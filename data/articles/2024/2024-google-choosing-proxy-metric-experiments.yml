approach: プロキシ構築をポートフォリオ最適化に帰着し、過去実験の処置効果をノイズ除去して潜在効果を推定。最適プロキシは実験のサンプルサイズに依存することを示す。
result: 産業用レコメンドシステムの実験で、複数のベースラインに対し良好な性能を報告。
