summary_ja: ECの配送費削減のため、同種商品をまとめて入れる条件や重量を考慮した実運用に即した梱包箱選択アルゴリズムを開発した。3次元ビンパッキングを実務制約つきで扱う。
problem: 配送料は梱包箱の三辺合計で決まることが多く、小さい箱ほど安い。3次元ビンパッキングはNP困難で、既存のヒューリスティックは実運用上の制約を見落としがち。
approach: 同種商品を近くに置く条件と重量を定式化し、注文ごとに適切な箱を選ぶアルゴリズムを構成した。
