title: 'MMBee: Live Streaming Gift-Sending Recommendations via Multi-Modal Fusion and Behaviour Expansion'
title_ja: 'MMBee: マルチモーダル融合と行動拡張によるライブ配信ギフト送信推薦'
published: '2024-08-25'
