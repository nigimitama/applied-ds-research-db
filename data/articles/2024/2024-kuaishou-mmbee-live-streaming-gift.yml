summary_ja: ライブ配信で視聴者がギフトを贈る確率を予測する推薦モデルMMBeeを提案。配信の画像・コメント・音声を学習可能クエリで融合し、ギフトグラフ上の関心拡張でスパース性を緩和する。Kuaishouに導入されA/Bテストで有効性を確認。
problem: ライブ配信では内容がリアルタイムに変化するが、従来のギフト推薦はカテゴリ特徴と過去行動に依存して内容変化を捉えられず、ギフト行動の疎性にも悩まされていた。
approach: 学習可能クエリによるマルチモーダル融合モジュールで配信セグメントの画像・コメント・音声を統合し、マルチモーダル属性付きの大規模ギフトグラフ上でユーザ/配信者表現を学習するグラフ誘導型の関心拡張を併用する。
