summary_ja: WeChat Channelsのライブ配信推薦で、短いライブ行動履歴を動画ドメインの長い履歴で補うLifelong Cross Network(LCN)を提案。公開データと実業務データで評価し、オンラインA/Bテストでも改善を得た。
problem: ライブ配信ドメインのユーザー行動履歴は動画ドメインよりはるかに短く(中央値約500)、長期的な興味を捉えにくい。
approach: 対照学習でドメイン間のアイテム埋め込みを橋渡しするCross Representation Productionモジュールと、3段のカスケード注意で多様な興味を捉えるLifelong
  Attention Pyramidを組み合わせる。
