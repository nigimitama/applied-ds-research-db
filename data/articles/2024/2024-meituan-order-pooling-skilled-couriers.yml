summary_ja: 熟練配達員の過去の配送経路から実現可能な注文の組み合わせを学習し、グラフ表現学習で低次元ベクトル間の類似度計算により探索空間を絞るSCDNを提案。Meituanの配車システムに導入された。
problem: オンデマンド配送のリアルタイム割当では、注文の相乗り候補の組み合わせが膨大で、熟練配達員の知見を取り込みつつ短時間で良い組み合わせを探す必要がある。
approach: 熟練配達員のデータからグラフ表現学習で注文の埋め込みを獲得し、類似度に基づいて組み合わせ探索を剪定して割当を精緻化する。
