summary_ja: 渋滞予測にスパースゲートの適応グラフ学習エキスパート群と、安定傾向・周期パターン用の2種のエキスパートをカスケード接続したCP-MoEを提案した。集約重みで判断根拠を解釈でき、DiDiの所要時間推定システムに導入されている。
problem: 都市の渋滞予測は欠損やノイズのある交通データの下で精度と信頼性を保つ必要があり、複雑な時空間依存の扱いと判断の透明性も求められる。
approach: 適応グラフ学習エキスパートの混合(MAGL)を中核に、安定傾向と周期性のエキスパートを前段に配置して難しいサンプルへMAGLの注力を向ける。順序回帰で複数エキスパートの協調を促し、集約重みで解釈性を得る。
