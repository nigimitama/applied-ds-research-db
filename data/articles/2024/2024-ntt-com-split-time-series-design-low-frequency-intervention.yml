summary_ja: 工場の定期メンテナンスのような低頻度で繰り返す介入の効果を、観測データから推定するために、分割時系列分析(ITSA)を各介入の前後の短い期間で行う手法を提案した。
problem: 従来のITSAは全体が非線形な場合の扱いと、異なる介入の結果の解釈に難がある。
approach: 各介入の前後の短い期間だけをモデル化して全体の非線形な効果を線形近似し、介入前のトレンドに基づく反事実予測と観測値の比較で効果を推定する。
