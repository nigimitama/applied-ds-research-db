summary_ja: 通常の分類問題を含意関係判定の形に書き換え、分類概念が変化した際の再学習に必要なラベル量を減らす手法を提案。小売クエリのコンセプトシフトデータで評価し、導入でラベリングコストを削減した。
problem: 分類の概念が変わるたびに大量の新規ラベルで再学習すると、ラベリングのコストと時間が膨大になる。
approach: 分類ラベルを仮説文として扱う含意関係(entailment)形式へ再定式化し、少数ショットでも新概念へ適応できるようにする。AG Newsの合成シフトと実小売クエリのデータで評価した。
