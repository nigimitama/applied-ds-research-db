summary_ja: 強化学習の状態重要度を説明する手法を標準環境・説明器・評価器で比較できるベンチマークXRL-Benchを提供する。表形式と画像の両方の状態を扱い、提案するTabularSHAPをNetEaseの実際のオンラインゲームサービスに適用した事例を示す。
problem: 説明可能な強化学習の手法は増えているが、状態を説明する手法を統一的に評価・比較する基盤がなく、実サービスでの有用性も検証しにくい。
approach: 標準的なRL環境、状態重要度の説明器、評価器をそろえたオープンソースの基盤を構築する。表形式データ向けにSHAP系の手法TabularSHAPを提案し、実際のオンラインゲームサービスに適用した。
