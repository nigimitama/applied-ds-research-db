title: 'FusionSF: Fuse Heterogeneous Modalities in a Vector Quantized Framework for Robust Solar Power
  Forecasting'
title_ja: FusionSF:ベクトル量子化で異種モダリティを融合する頑健な太陽光発電予測
published: '2024-08-25'
collected: '2026-11-10'
