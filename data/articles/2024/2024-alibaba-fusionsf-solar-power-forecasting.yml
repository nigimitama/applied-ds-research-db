  type: conference
  venue: KDD Applied Data Science Track
evidence: peer_reviewed
lang: en
summary_ja: 過去の発電量、数値気象予報、衛星画像の3種類のデータをベクトル量子化で揃えて融合する太陽光発電予測モデルFusionSFを提案。新設発電所へのゼロショット予測にも対応し、eForecasterプラットフォームで運用されている。
problem: 太陽光発電は気象に左右されて予測が難しく、新設の発電所は履歴データが少ない。情報密度が異なるモダリティを過学習せずに統合する必要がある。
approach: 衛星画像はトークン化・マスクの上でViT、発電時系列とNWP共変量は量子化してTemporal Transformerで処理し、Cross Transformerで3モダリティを融合する。
