summary_ja: 任意のアスペクト比を扱えるVision TransformerをMasked Autoencoderで事前学習し、広告画像の配信効果予測に適用した。RoPEとFlash Attentionを使って高い性能のモデルを得た。
problem: ディスプレイ広告は様々なアスペクト比があり、比を変えると見る人への印象も変わるため、アスペクト比情報を保ったまま効果を予測する必要がある。
approach: 任意アスペクト比のViTをMAEで事前学習し、Rotary Position EmbeddingとFlash Attentionを用いて広告画像の効果を予測する。
