summary_ja: クリックの二値ラベルで同順位が多発する問題に対し、ベータ分布で補助ラベルを作って比較可能なペアを増やし、ランキングとキャリブレーションをマルチタスクで同時最適化するBBPを提案。オフラインとオンライン実験で有効性を確認している。
problem: CTR予測にペアワイズ等の順位損失を足す既存手法は、二値の選好によるタイの多さとデータスパース性のため、較正や汎化が不十分になりやすい。
approach: ベイズ的にベータ分布を推定してタイを破るデータ拡張を行い、補助ラベルでペアを増やす。キャリブレーションを第二タスクとするマルチタスク学習で両目的を同時に最適化する。
