summary_ja: Shopee検索のプレランキング向けに、タスク間を残差接続で結び、スコアを加算で統合する軽量なマルチタスク枠組みResFlowを提案。オフライン指標Weighted Recall@Kも導入した。
problem: 複数の目的(クリック・注文など)を同時に扱うランキングでは、タスク間の情報共有と、オフライン指標とオンライン指標のずれが課題になる。
approach: 残差接続でタスク間の情報を流し、従来の乗算ではなく加算でマルチタスクのスコアを融合する。オンライン指標に整合するオフライン評価指標を設計した。
