summary_ja: ハンドメイドC2Cマーケットminneで、長期間取引のないユーザーが再び購入・出品するかを予測する実験を行った。購入者では非常に高い精度が得られた一方、出品者では得られず、各説明変数の寄与も調べた。
problem: 休眠ユーザーの復帰はサービス提供者にとって重要だが、復帰についての詳細な研究は少ない。
approach: minneの購入者・出品者それぞれについて、長期間取引のないユーザーが再購入・再出品するかを予測し、説明変数の寄与を分析する。
