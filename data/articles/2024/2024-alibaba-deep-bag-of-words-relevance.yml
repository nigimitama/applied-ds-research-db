summary_ja: EC検索のクエリ・商品間の関連性判定で、クエリと商品をスパースな単語重み表現に変換し、一致語の重み和でスコアを出すDeepBoWを提案。BERT系の遅さと2塔モデルの不透明さを同時に解消する。
problem: BERT等の事前学習モデルは高精度だがオンライン推論が遅く、2塔モデルは効率的だが解釈・調整が困難で、EC検索の関連性判定に不向きである。
approach: クエリと商品を単語ごとの重みを持つスパース表現に符号化し、一致した単語の重みを合計して関連性を算出する。これにより説明と調整が容易になる。
