summary_ja: 複数小売業者を束ねる食料品配送プラットフォームShiptで、商品間の交差弾力性を加法的ニューラルネットで学習し、進化的アルゴリズムで店舗・商品単位の価格を制約付きで最適化する動的価格設定を提案。
problem: 独立した複数小売業者の在庫を把握できず、ブランドや地域で需要が異なるため、既存の動的価格手法はそのまま適用できない。
approach: 敵対的データで拡張した加法型ニューラルネットで需要と商品間の交差弾力性をモデル化し、バンディット着想の探索・活用機構を加えた遺伝的アルゴリズムでビジネス制約下の価格を最適化する。
