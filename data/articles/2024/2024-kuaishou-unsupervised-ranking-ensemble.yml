summary_ja: 複数の行動目的ごとのランキングを1つに統合するランキングアンサンブルで、教師信号の設計不備による情報損失を避ける教師なしモデルを提案。ショート動画プラットフォームへの導入で改善を得ている。
problem: クリック、長時間視聴、いいね等の複数目的で得た複数のランキングを統合する際、学習の教師信号が不適切だと入力順位の情報が大きく失われる。
approach: 出力順位が各入力順位の順序に近づくような距離尺度の損失と、隠れ層から入力の数値を復元するデコーダを用い、順序と数値の両方の情報を保持する。様々なランキングモデルやアンサンブル構造に適用可能。
