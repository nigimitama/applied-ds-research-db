summary_ja: ユーザーのイベント系列を用いて、複数の施策をどのタイミングで打つべきかの効果を推定する時間的アップリフトモデル(TPPUM)を提案。マーク付き時間点過程と敵対的バランシングを組み合わせ、施策選択とタイミング選択を最適化した。
problem: 従来のアップリフトモデリングは単発の施策を想定しており、複数の施策が時間をまたいで行われる実際のマーケティングでは、施策の種類とタイミングの両方を考慮した効果推定が難しい。
approach: ユーザーのイベント系列をマーク付き時間点過程でモデル化し、マーケティング施策を介入、購買を結果イベントとして反事実推定を行う。介入群と非介入群の表現を敵対的にバランスさせて選択バイアスを抑える。
