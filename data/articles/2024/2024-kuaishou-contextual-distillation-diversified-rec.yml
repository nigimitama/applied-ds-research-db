summary_ja: MMRによる多様性考慮の選択確率を、同一リクエスト内の候補アイテムを文脈として推定する蒸留生徒モデル(CDM)を提案した。推論は推薦スコアと生徒モデルのスコアの線形結合で行い、短尺動画のKuaishouでのオンラインA/Bテストで品質と多様性の向上を報告している。
problem: 推薦では精度に加え多様性も体験に重要だが、DPPやMMRのような貪欲法は計算量が二乗オーダーで、再ランキング段階以外には使いにくい。
approach: MMRが選ぶ確率を教師として生徒モデルを学習し、対照学習ベースのコンテキストエンコーダで同一リクエスト内の正負の文脈を表現する。
