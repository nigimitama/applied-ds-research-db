summary_ja: 検索の負例サンプリングで、未ラベルの正例が偽陰性として使われるプーリングバイアスを、クエリ間の意味的類似度で偽陰性確率を推定するBHNSで緩和した。公開データ、Instacartの社内オフラインデータ、実運用の検索システムで評価している。
problem: 負例を無関係と扱うと、実は関連する未ラベルの商品を偽陰性として学習してしまい、モデル性能が劣化する。
approach: クエリ間の意味的類似度で偽陰性らしさを推定し、サンプリングの正則化と疑似ラベル生成の2つのモジュールに利用するバイアス緩和型ハードネガティブサンプリング。
