summary_ja: 太陽光発電の運用に向け、衛星観測データを直接使う雲力学と深層学習を組み合わせて6時間先までの日射量を予測するモデルを開発した。数値予報や衛星動画予測の初期値精度や雲変化の表現の限界を補う。
problem: 数値気象予報や衛星観測の動画予測では、初期値の精度と雲の複雑な変化の記述に限界がある。
approach: 衛星観測データから初期値を高精度に推定し、雲力学と深層学習を組み合わせて6時間先までの日射量を予測する。
