summary_ja: 干渉露光機のステージ動作の異常検知を、LSTMのseq2seqモデルで検討した。機器の出力とモデルの出力を比較して異常を検知し、予測値が正常な装置の挙動をよく再現した。
problem: 装置の運用安定性と保守性を高めるため、運転データによる異常検知と故障予知が必要。
approach: 入出力が時系列であるステージ動作に対し、LSTMのseq2seqモデルで正常動作を学習し、実機との差で異常を検知する。
