summary_ja: EC物流で配送コストを下げる段ボール箱サイズ自体の設計を、ベイズ最適化で解く手法を提案した。注文の全商品が入る最小の箱を選ぶ組合せ最適化と、箱寸法の最適化の2つに分けて扱う。
problem: 箱サイズの設計は配送費に直結するが、組合せが膨大で、箱サイズ設計そのものを数理問題として最適化した研究は少ない。
approach: 問題を、注文に合う最小の箱の選択と箱寸法の探索に分け、後者にベイズ最適化を用いて配送コストを最小化する寸法を求める。
