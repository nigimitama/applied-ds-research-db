summary_ja: 大規模工場のエネルギー需要の予測に、時系列XAI技術を用いて予測モデルの性能と説明性を高めた。設備稼働や天候で変動する需要を、ブラックボックスになりがちな深層学習で扱う。
problem: 電力自由化やカーボンニュートラルでエネルギー管理が重要になる中、工場の需要は設備稼働や天候により変動し、高精度な予測が求められる。深層学習は精度が高い反面ブラックボックスになる。
approach: 時系列XAIで予測の根拠を把握し、その知見を使ってモデルの性能と説明性を高める。
