summary_ja: メンバーなど個別エンティティ向けにモデルを適応させるMAMLをLinkedInの推薦に導入。メタ学習した部分ネットワークを固定長のメタ埋め込みに変換し、数千億パラメータのモデルでもオンライン配信できるようにした。
problem: 元のMAMLベースのモデルをオンライン推薦に載せるのはほぼ不可能で、個別化のための最近の行動シグナルの反映が難しかった。
approach: メタ学習した部分ネットワークを固定サイズのベクトル(メタ埋め込み)へ変換し、推論時にオンラインで利用する。
