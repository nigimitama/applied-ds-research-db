title: Transportation Marketplace Rate Forecast Using Signature Transform
title_ja: シグネチャ変換を用いた輸送マーケットプレイスの運賃予測
published: '2024-08-25'
collected: '2026-11-10'
companies:
- amazon
collab_academia: true
source:
  type: conference
  venue: KDD Applied Data Science Track
