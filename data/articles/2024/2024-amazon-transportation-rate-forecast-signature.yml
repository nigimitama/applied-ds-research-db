lang: en
summary_ja: 輸送市場の運賃予測に、シグネチャ変換とシグネチャカーネルを使って季節性やレジーム切替を捉える適応型2段階LASSOを提案。Amazonのトラック輸送業務で運用されている。
problem: 輸送市場の運賃は季節性やレジーム変化の影響を受け、市販の予測モデルでは精度や解釈性に限界がある。
approach: シグネチャ変換により予測を線形回帰問題に帰着し、シグネチャカーネルで時系列間の類似度を測って季節性・レジーム切替を検出し、適応型2段階LASSOで予測する。
