summary_ja: 自動車の衝突安全シミュレーションに必要な繊維強化樹脂部品の繊維配向を、従来の樹脂流動解析と同等の情報で出力するサロゲートモデルを開発した。流動解析の長い計算時間が開発サイクルへの組み込みの障壁になっていた。
problem: 樹脂部品の強度は繊維の配向で大きく変わり、衝突シミュレーションに繊維配向の影響を含める必要があるが、樹脂流動解析は時間がかかり定常的な開発サイクルに組み込みにくい。
approach: 樹脂流動解析の結果を学習し、繊維配向を出力するサロゲートモデルを構築した。
