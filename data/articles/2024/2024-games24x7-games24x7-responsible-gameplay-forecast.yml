title: Explainable and Interpretable Forecasts on Non-Smooth Multivariate Time Series for Responsible
  Gameplay
title_ja: 責任あるゲームプレイのための非平滑多変量時系列の説明可能な予測
published: '2024-08-25'
collected: '2026-11-10'
companies:
- games24x7
collab_academia: false
source:
