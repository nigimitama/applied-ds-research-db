summary_ja: オンラインゲームでの過度なプレイヤー行動を事前に予測するため、予測精度・平滑で理解しやすい予測軌道・属性や事象に基づく説明を同時に満たす深層ネットワークAFNを提案。実プレイデータで数週間先の過剰プレイ検知を評価する。
problem: マルチプレイヤーゲームの行動データは不規則で非線形なため、時間的平滑性を前提とする既存の解釈可能な時系列手法が使えず、責任あるゲームプレイ支援に必要な予測と説明の両立が難しい。
approach: Actionable Forecasting Network(AFN)により、注意機構に基づく入力特徴・事象の説明を伴いながら、平滑で解釈しやすい予測軌道を出力する。
