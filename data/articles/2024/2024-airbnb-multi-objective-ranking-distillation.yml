summary_ja: 購入などの主目的に加え、キャンセルやレビューなどの副目的も考慮するマーケットプレイスのランキングを、複数の単一目的の教師モデルから生徒モデルへ蒸留する問題として解く手法を提案。Airbnbに実装した。
problem: 副目的のデータが疎で不均衡であり、一時的な事業目標にも対応しづらい。微分不可能なビジネス目標をランキングへ組み込むことも難しい。
approach: 各目的の教師モデルの予測を集約したものを生徒モデルが学習する蒸留としてマルチ目的ランキングを定式化し、自己蒸留でシステムを簡素化できることも示す。
