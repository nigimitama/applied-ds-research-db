summary_ja: 推薦のマルチタスク学習で、勾配の大きさを最大ノルムに合わせて調整し、全タスク間の方向衝突を一括で射影解消するGradCraftを提案。WeChatとKuaishouのデータで評価し、オンライン実験も行った。
problem: 既存のマルチタスク学習手法は推薦特有の事情を考慮せず、勾配の大きさと方向の双方でバランスが不十分だった。
approach: 勾配の大きさを動的に最大ノルムへ揃え、ペアごとではなく全ての衝突タスクに対して射影を行い方向衝突を大域的に解消する。
