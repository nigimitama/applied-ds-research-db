summary_ja: COVID-19が5類に移行し、全数報告から週次の定点当たり報告数になって実効再生産数の算出が難しくなった。週次の定点報告から実効再生産数を推定し、流行の早期把握に使う予測モデルを感染症数理モデルで構築した。
problem: 実効再生産数の算出には日次のデータが必要だが、5類移行後は週次の定点報告になり、感染拡大の兆候を早期に把握しにくい。
approach: 感染症数理モデルを使い、週次の定点当たり報告数から実効再生産数を推定して流行を予測する。
