summary_ja: 故障強度の診断でクラス間の階層関係を活かす損失関数(階層木損失とグループ木トリプレット損失)を提案。SAMSON AGのキャビテーション実データを含む産業データで評価した。
problem: 故障強度診断の既存手法は対象クラス間の関係を無視しており、微小な故障の識別が難しく実用に限界がある。
approach: クラスの属性共有を木構造制約で表す階層木損失(焦点版を含む)と、木距離で動的マージンを与えるグループ木トリプレット損失で、階層的に一貫した表現と予測を得る。
